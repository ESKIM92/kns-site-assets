&lt;p class="lvnote" id="lvnote"&gt;사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.&lt;/p&gt;
&lt;p id="tvnote" style="font-size:12.5px;color:#5E6B78;padding:10px 16px"&gt;행을 누르면 전원 · 사용 온도 · 특징 · 자료 출처가 펼쳐집니다. 사양은 대표값이며 형번(옵션)에 따라 다릅니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다.&lt;/p&gt;

&lt;section class="box blk apc" id="apc"&gt;&lt;div class="aph"&gt;&lt;div&gt;&lt;h2&gt;이 제품이 쓰인 현장&lt;/h2&gt;&lt;p class="apl"&gt;제조사가 공개한 실제 적용 사례 4건 — 어떤 설비에서 무엇을 해결했는지 보고 선정에 참고하세요.&lt;/p&gt;&lt;/div&gt;&lt;a class="apall" href="/15#p=light-curtain"&gt;적용 사례 4건 전체 보기 ›&lt;/a&gt;&lt;/div&gt;&lt;div class="apg"&gt;&lt;a class="apk" href="/15#reer-modula"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-modula.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;물류 · 자동창고 · ReeR&lt;/span&gt;&lt;b&gt;수직 자동창고 Modula Lift — 안전 + 높이 측정을 한 시스템으로&lt;/b&gt;&lt;span class="ac2"&gt;Modula S.p.A.&lt;/span&gt;&lt;span class="apb ex"&gt;적용 형번 EOS2 XM/XS/XS2&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#reer-brisbane"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-brisbane.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;인프라 · 에너지 · 공공설비 · ReeR&lt;/span&gt;&lt;b&gt;항만 컨테이너 야드 외곽 보호 — 옥외 대면적 출입 통제&lt;/b&gt;&lt;span class="ac2"&gt;Port of Brisbane AutoStrad Terminal&lt;/span&gt;&lt;span class="apb ex"&gt;적용 형번 ADMIRAL WT/WTH&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#reer-cheese"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-cheese.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;포장 · 식품 · 음료 · ReeR&lt;/span&gt;&lt;b&gt;치즈 포셔닝 머신 — 기능 안전 통합&lt;/b&gt;&lt;span class="ac2"&gt;Facchinetti Srl&lt;/span&gt;&lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#reer-pallet"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-palletizer.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;포장 · 식품 · 음료 · ReeR&lt;/span&gt;&lt;b&gt;불규칙 적재물 팔레타이저 — 뮤팅을 컨트롤러로 관리&lt;/b&gt;&lt;span class="ac2"&gt;고객사 비공개&lt;/span&gt;&lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;p class="apn"&gt;표시: &lt;span class="apb ex"&gt;적용 형번&lt;/span&gt; 사례에 그 형번이 명시됨 · &lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt; 같은 시리즈 · 계열 사용 · &lt;span class="apb re"&gt;관련 사례&lt;/span&gt; 같은 제조사의 관련 제품(당사 선정표 외 형번 포함). 사례 내용은 제조사 공개 자료 기준입니다.&lt;/p&gt;&lt;/section&gt;
&lt;section class="box blk" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#EEF5FB,#DCEBF8)"&gt;
&lt;div style="flex:1 1 420px"&gt;&lt;h2&gt;찾는 사양이 없거나 쓰시던 형번으로 바꾸고 싶으신가요?&lt;/h2&gt;&lt;p class="lead" style="color:#3D4A57"&gt;쓰시던 형번과 명판 사진을 보내 주시면 사양을 맞춰 검토 결과를 회신드립니다. 사양이 완전히 같지 않을 수 있어 비교표와 함께 제안드립니다.&lt;/p&gt;&lt;/div&gt;
&lt;div style="display:flex;gap:8px;flex-wrap:wrap"&gt;&lt;a class="btn b1" href="/substitute"&gt;대체 검토 요청&lt;/a&gt;&lt;a class="btn b2" href="/16"&gt;견적 · 기술 문의&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;div data-pane="guide" hidden=""&gt;&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;라이트커튼 · 안전 라이트 커튼 선정 가이드&lt;/h2&gt;&lt;p class="lead"&gt;아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.&lt;/p&gt;&lt;div class="g4"&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;안전 등급 정하기&lt;/h3&gt;&lt;p&gt;위험성 평가(ISO 13849-1)에서 요구된 PL에 맞춰 Type 4(PL e·Cat. 4: ADMIRAL·EOS4·JANUS) 또는 Type 2(PL c·Cat. 2: EOS2·VISION)를 고릅니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;검출 대상(분해능)&lt;/h3&gt;&lt;p&gt;제조사 구분은 손가락 14 mm, 손 20·30·40 mm, 몸 50·90 mm, 출입 감지용 멀티빔입니다. 접근 거리와 안전 거리 계산 결과로 확정합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;보호 높이와 검출 거리&lt;/h3&gt;&lt;p&gt;보호 높이와 투수광기 사이 거리를 정하고, 동작 거리 선택(저/고 범위)이 있는 모델은 설치 거리가 선택 범위에 들어가는지 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;4&lt;/span&gt;&lt;h3&gt;기능과 환경&lt;/h3&gt;&lt;p&gt;자동 재기동만 쓸지, 재기동 선택·EDM·블랭킹·뮤팅·마스터-슬레이브가 필요한지 정하고, 방수(IP67·IP69K)·고진동·ATEX 같은 설치 환경을 마지막으로 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="docs" hidden=""&gt;&lt;section class="box blk" id="docs"&gt;&lt;h2&gt;데이터시트 · 자료&lt;/h2&gt;&lt;p class="lead"&gt;최신 자료는 제조사 공식 페이지에서 받으실 수 있습니다. 한글 자료는 자료실에 모아 둡니다.&lt;/p&gt;
&lt;div class="dgs"&gt;&lt;div class="dg dg-ds"&gt;&lt;h3&gt;데이터시트&lt;span&gt;사양 · 치수 · 배선 — 가장 먼저 확인&lt;/span&gt;&lt;em&gt;8&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1310650.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;EOS4 2B AH&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1010651.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;EOS4 3B AH EX (ATEX)&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1320600.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;EOS2 2B A&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1330601.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;ADMIRAL AD 3B&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1334060.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;ADMIRAL AX 151 BK&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1360662.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;JANUS MI 4B&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1344307.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;VISION VX 1204&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-ds" href="https://www.reersafety.com/datasheet/en/1344812.pdf" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;VISION MXL 454&lt;/b&gt;&lt;small&gt;ReeR 공식 — 데이터시트&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-cert"&gt;&lt;h3&gt;인증서 · 적합성 선언&lt;span&gt;&lt;/span&gt;&lt;em&gt;2&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-cert" href="https://www.reersafety.com/en/explosion-proof-safety-light-curtains/" rel="noopener" target="_blank"&gt;&lt;i&gt;CERT&lt;/i&gt;&lt;span&gt;&lt;b&gt;EOS4 방폭 안내&lt;/b&gt;&lt;small&gt;ReeR 공식 — ATEX 표기&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cert" href="https://www.reersafety.com/en/high-vibrations-safety-light-curtains/" rel="noopener" target="_blank"&gt;&lt;i&gt;CERT&lt;/i&gt;&lt;span&gt;&lt;b&gt;EOS4 고진동 모델 안내&lt;/b&gt;&lt;small&gt;ReeR 공식 — 진동·충격 시험 (EOS4 AT/ATL · XT/XTL 대상)&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-kns"&gt;&lt;h3&gt;한국케이앤에스(주) 자료실&lt;span&gt;&lt;/span&gt;&lt;em&gt;1&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-kns" href="/59"&gt;&lt;i&gt;KNS&lt;/i&gt;&lt;span&gt;&lt;b&gt;자료실 — 카탈로그&lt;/b&gt;&lt;small&gt;한국케이앤에스(주) 자료실&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class="box blk faq"&gt;&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Type 4와 Type 2는 무엇이 다른가요?&lt;/summary&gt;&lt;p&gt;ReeR 데이터시트 기준 ADMIRAL·EOS4·JANUS는 Type 4·PL e·Cat. 4(SILCL 3), EOS2·VISION은 Type 2·PL c·Cat. 2(SILCL 1)입니다. 어느 등급이 필요한지는 기계별 위험성 평가 결과에 따릅니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;EOS4 ATEX는 국내 폭발위험장소에 바로 쓸 수 있나요?&lt;/summary&gt;&lt;p&gt;제조사 표기는 ATEX Category 3, Zone 2·22(II 3G Ex nA IIC T6 Gc / II 3D Ex tc IIIC T 60 ℃ Dc)입니다. 국내 사용 시에는 KCs 방폭 인증 여부를 별도로 확인해야 하며, 이 페이지는 국내 방폭 인증 보유를 뜻하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;마스터·슬레이브(XM·XS)는 몇 대까지 연결하나요?&lt;/summary&gt;&lt;p&gt;EOS4·EOS2는 마스터(XM)·1차 슬레이브(XS)·2차 슬레이브(XS2) 3종 구성이며, 마스터-슬레이브 간 케이블은 최대 50 m입니다. ADMIRAL·VISION의 M/S 구성은 형번별 데이터시트로 확인합니다.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
&lt;p class="src"&gt;조회 2026-10-13. ReeR 공식(reersafety.com) 데이터시트 PDF·제품 페이지·카테고리 페이지 기준. 인증서 PDF는 로그인 필요로 열람하지 못했고, cULus 마크는 공식 출처 2곳으로 확인된 것만 사용했습니다. 형번마다 값이 다른 항목은 확인한 대표 형번을 괄호로 표기했습니다.&lt;/p&gt;

    if (!error) {
      error = document.createElement('p');
      error.className = 'v79-error';
      error.setAttribute('role', 'alert');
      (container.querySelector('.qft') || container).appendChild(error);
    }
    error.textContent = first ? '수량은 1 이상의 정수로 입력해 주세요.' : '';
    if (first) {
      first.focus();
      first.reportValidity();
      return false;
    }
    return true;
  }
  window.KQ79 = {validate: validate};
  document.addEventListener('input', function (e) {
    if (e.target.matches('#qm [data-k=q],#bk [data-k=q]')) {
      e.target.setCustomValidity('');
      e.target.removeAttribute('aria-invalid');
      var box = e.target.closest('#qm,#bk');
      var error = box.querySelector('.v79-error');

  });

    var link = e.target.closest('[data-act=request]');

    if (!modal.querySelector('[data-k=q]') || !validate(modal)) return;

      form.scrollIntoView({behavior: 'smooth', block: 'start'});
