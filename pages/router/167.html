<tbody id="tb"><tr class="r" data-id="r403" id="r403"><td class="ck"><input aria-label="D4-454 견적 담기" data-n="AC 전원 CPU · 래더 31.5k워드 · PID 16루프 내장 · 통신 4포트" data-q="D4-454" type="checkbox"/></td><td class="im"><span aria-label="D4-454" class="spr" role="img" style="background-image:url(https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/sprite/plc-large.png);background-position:0 0.00000000%;background-size:100% auto;background-repeat:no-repeat;aspect-ratio:1"></span></td><td class="nm"><b>D4-454</b><small>AC 전원 CPU · 래더 31.5k워드 · PID 16루프 내장 · 통신 4포트</small></td><td>JTEKT</td><td>CPU</td><td class="num">로컬 입력 1,024 + 출력 1,024점<small> (확장 베이스 포함)</small></td><td>통신 4포트: RS-232C 2개(DB15 · RJ12) + RS-232C/RS-422/RS-485 2개(DB25)<small> · DirectNET · Modbus RTU · K-sequence · ASCII Out · 시리얼 리모트 I/O, 9.6k 고정 ~ 최대 38.4k baud</small></td><td>AC 85~132 V / 170~264 V<small> (JTEKT) · 최대 50 VA · 베이스 5 V 3,100 mA 공급 · 보조 24 V DC 400 mA</small></td><td>SU-5 · SU-6 · D4-450 등 구형 CPU의 후속(JTEKT)</td><td><span class="mks"></span></td></tr><tr class="dx" data-for="r403" hidden=""><td colspan="9"><div class="dxi"><div class="dxs"><div><span>전원</span><b>AC 85~132 V(100 V대) / 170~264 V(200 V대), 최대 50 VA, 돌입 전류 20 A · 보조 24 V DC 출력 20~28 V 최대 400 mA · 베이스에 5 V 3,100 mA 공급</b></div><div><span>사용 온도</span><b>0 ~ 60 ℃ (보관 −20 ~ +70 ℃, D4-454 사용자 매뉴얼 ch2 기준)</b></div></div><div class="dxf"><span class="dxl">주요 특징</span><ul><li>래더 메모리 31.5k워드(내장), 전체 프로그램 메모리 46.8k워드, 명령어 255개, 접점 실행 0.96 µs</li><li>PID 16루프 내장, 실시간 시계, 백업 배터리(D2-BAT-1) 포함, 프로그램은 DirectSOFT v6.1 이상</li><li>베이스는 -1형(D4-04B-1 · 06B-1 · 08B-1)만 지원, 확장 베이스 최대 3개, 시리얼 리모트 I/O 최대 4,224점(채널당 512점 · 포트3은 2,048점 · 채널당 슬레이브 7대)</li><li>데이터 메모리(V메모리)는 사양서 · JTEKT 15.3k워드, AutomationDirect 컷시트는 User Data Memory 7k워드로 달리 표기</li><li>JTEKT 일문 페이지의 최대 입출력 8,192점(I+Q+GI+GQ)은 AutomationDirect 사양서의 CPU 메모리 I/O 8,192점(X+Y+GX+GY)과 같은 값이며 실제 로컬 I/O 점수가 아님</li><li>AutomationDirect 자료 표기: 명령어 210개 · DB25 포트 RS-232/RS-422(사용자 매뉴얼은 포트3을 RS-422로 표기) · 시리얼 리모트 I/O 1,536점</li></ul><p class="dxsrc" style="color:#A85400">참고 · AC 전원 범위는 자료마다 다릅니다: JTEKT 85~132 / 170~264 V, 사용자 매뉴얼 100~120 / 196~240 V(+10 % −15 %), AutomationDirect 컷시트 120~240 V. 5 V 공급은 매뉴얼 사양표 3,100 mA, 같은 매뉴얼의 계산 예제는 3,700 mA입니다. 시리즈 방침: AutomationDirect는 DL405를 기존 설비용 레거시 시리즈로 분류하며 개별 단종 표기는 아닙니다. JTEKT는 D4-454를 SU 시리즈 후속 CPU로 안내합니다. 시리얼 리모트 I/O는 JTEKT 카탈로그 CPU 사양표 · AutomationDirect 사양서가 최대 4,224점, 사용자 매뉴얼이 1,536점, JTEKT 리모트 모듈 사양표가 CPU당 슬레이브 1,024점으로 달라, 이 표에는 JTEKT CPU 사양표 값을 썼습니다.</p></div><div class="ac"><a class="btn sm b1" href="/shop_view/?idx=403">상세 보기 →</a><a class="dsb" href="https://cdn.automationdirect.com/static/specs/cutsheet/D4-454_cutsheet.pdf" rel="noopener" target="_blank" title="D4-454 컷시트 · cdn.automationdirect.com"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"></path></svg>사양서 PDF</a><button class="qadd" data-n="AC 전원 CPU · 래더 31.5k워드 · PID 16루프 내장 · 통신 4포트" data-q="D4-454" type="button">+ 견적 담기</button></div><p class="dxsrc">자료 출처 · AutomationDirect 제품 페이지 D4-454 (https://www.automationdirect.com/pn/D4-454) · 사양서 d4454specs.pdf (https://cdn.automationdirect.com/static/specs/d4454specs.pdf) · 컷시트 (https://cdn.automationdirect.com/static/specs/cutsheet/D4-454_cutsheet.pdf) · D4-454 사용자 매뉴얼 ch2 · ch3 · ch4 (https://cdn.automationdirect.com/static/manuals/d4454userm/d4454userm.html) · JTEKT 제품 페이지 (https://www.electronics.jtekt.co.jp/jp/product/plc/directlogic-405-su-2/) · JTEKT 종합 카탈로그 Vol.20 p.256 · 260 · 262 (https://www.electronics.jtekt.co.jp/jp/uploads/D4-454_SU_20.pdf)</p></div></td></tr><tr class="r" data-id="r404" id="r404"><td class="ck"><input aria-label="D4-454DC-1 견적 담기" data-n="DC 24 V 전원 CPU · 래더 31.5k워드 · PID 16루프 내장 · 통신 4포트" data-q="D4-454DC-1" type="chec <p class="lvnote" id="lvnote">사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.</p>

<div data-pane="guide" hidden=""><section class="box blk" id="guide"><h2>대형 PLC · DirectLOGIC DL405 선정 가이드</h2><p class="lead">아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.</p><div class="g4"><div class="stp"><span class="no">1</span><h3>CPU와 베이스</h3><p>CPU는 AC 전원 D4-454 또는 DC 전원 D4-454DC-1이며, 베이스는 -1형(D4-04B-1 · 06B-1 · 08B-1)만 지원합니다. 확장 베이스는 확장 유닛(D4-EX · D4-EXDC)과 확장 케이블로 최대 3개까지 늘릴 수 있습니다.</p></div><div class="stp"><span class="no">2</span><h3>입출력 종류와 점수</h3><p>입력은 DC · AC · AC/DC, 출력은 DC(싱킹 · 소싱) · AC(트라이액) · 릴레이로 나뉘며 8 · 16 · 32 · 64점 모듈이 있습니다. 싱킹 · 소싱은 AutomationDirect 사양서 표기이므로 연결할 센서 · 부하의 결선도와 함께 확인하십시오.</p></div><div class="stp"><span class="no">3</span><h3>아날로그 · 온도</h3><p>신호가 전압인지 전류인지, 입력인지 출력인지, 채널 수(4 · 8 · 16)와 절연 필요 여부(F4-04ADS · F4-04DAS-1)를 정합니다. 온도는 RTD(F4-08RTD), 열전대(F4-08THM), PID 조절(F4-4LTC) 중에서 고릅니다. F4-08RTD를 제외한 아날로그 · 열전대 모듈은 외부 DC 전원(대부분 24 V)이 필요합니다.</p></div><div class="stp"><span class="no">4</span><h3>5 V 전력 예산과 슬롯</h3><p>선택한 모듈의 5 V 소비 전류 합계(베이스 자체 80 mA 포함)가 CPU(D4-454 계열 3,100 mA) 또는 확장 유닛(D4-EX · D4-EXDC 4,000 mA)의 공급량 이내인지 확인합니다. 64점 모듈은 CPU 베이스 전용이며 사용 시 같은 베이스의 슬롯 5 · 6 · 7에 특수 모듈을 둘 수 없습니다.</p></div></div></section></div>
<div data-pane="disc" hidden=""><section class="box blk" id="disc"><h2>단종 상품 · 후속 형번</h2><p class="lead">제조사 단종 안내 기준입니다. 단종 문의도 받습니다 — 후속 · 대체 제품으로 안내해 드립니다.</p><table class="kt"><tr class="gh"><th>단종 형번</th><th>제조사</th><th>시기</th><th>후속 · 대체</th><th>근거</th></tr><tr><th>D4-EE-2 (메모리 카트리지)</th><td>JTEKT</td><td>2024-07 (AutomationDirect 표기 Retired 07/2024)</td><td>제조사 후속 표기 없음 · 대체 검토 (AutomationDirect: 직접 대체품 없음 / JTEKT 안내: D4-454는 메모리 카트리지가 필요 없음)</td><td style="font-size:12px;word-break:break-all"><a href="https://www.automationdirect.com/pn/D4-EE-2" rel="noopener" style="color:#0070C0" target="_blank">제조사 자료</a></td></tr><tr><th>D4-RSDC (D4-RS의 DC 전원형)</th><td>JTEKT</td><td>2018-10 (AutomationDirect 표기 Retired 10/2018)</td><td>JTEKT 일문 폐지 표 기재 후속: U-02RS(= D4-RS, AC 전원형이라 전원 방식 확인 필요) · AutomationDirect: 대체품 없음 · JTEKT 영문 현행 표에는 D4-RSDC가 남아 있어 자료 간 상충</td><td style="font-size:12px;word-break:break-all"><a href="https://www.automationdirect.com/pn/D4-RSDC" rel="noopener" style="color:#0070C0" target="_blank">제조사 자료</a></td></tr><tr><th>H4-EBC (이더넷 베이스 컨트롤러)</th><td>JTEKT</td><td>연월 미표기 (JTEKT 폐지 표 기재)</td><td>제조사 후속 표기 없음 · 대체 검토 (AutomationDirect 제품 페이지는 레거시 시리즈로 게재)</td><td style="font-size:12px;word-break:break-all"><a href="https://www.electronics.jtekt.co.jp/jp/product/plc/directlogic-405-su-2/" rel="noopener" style="color:#0070C0" target="_blank">제조사 자료</a></td></tr></table></section></div>

div><div class="dg dg-cat"><h3>카탈로그 · 매뉴얼<span></span><em>7</em></h3><div class="dl"><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d4454userm/d4454userm.html" rel="noopener" target="_blank"><i>PDF</i><span><b>D4-454 사용자 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d4user/d4user.html" rel="noopener" target="_blank"><i>PDF</i><span><b>DL405 사용자 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d4anlg/d4anlg.html" rel="noopener" target="_blank"><i>PDF</i><span><b>DL405 아날로그 I/O 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d4remio/d4remio.html" rel="noopener" target="_blank"><i>PDF</i><span><b>DL405 리모트 I/O 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d4dcm/d4dcm.html" rel="noopener" target="_blank"><i>PDF</i><span><b>D4-DCM 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/hxecomm/hxecomm.html" rel="noopener" target="_blank"><i>PDF</i><span><b>이더넷 통신 매뉴얼 (H4-ECOM100)</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a><a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/hxctriom/hxctriom.html" rel="noopener" target="_blank"><i>PDF</i><span><b>H4-CTRIO 매뉴얼</b><small>AutomationDirect 공식 — 매뉴얼</small></span></a></div></div><div class="dg dg-web"><h3>제조사 제품 페이지<span></span><em>4</em></h3><div class="dl"><a class="dk dk-web" href="https://support.automationdirect.com/docs/xref.html" rel="noopener" target="_blank"><i>WEB</i><span><b>KOYO ↔ DirectLOGIC 형번 교차 참조표</b><small>AutomationDirect 공식 — 형번 대응표</small></span></a><a class="dk dk-web" href="https://cdn.automationdirect.com/static/press/PLC_Family_Roadmap_Statement.pdf" rel="noopener" target="_blank"><i>WEB</i><span><b>PLC 시리즈 방침 문서 (Statement of Direction)</b><small>AutomationDirect 공식 — 시리즈 정책</small></span></a><a class="dk dk-web" href="https://www.electronics.jtekt.co.jp/jp/product/plc/directlogic-405-su-2/" rel="noopener" target="_blank"><i>WEB</i><span><b>JTEKT DirectLOGIC 405 (일문)</b><small>JTEKT 공식 — 제품 페이지</small></span></a><a class="dk dk-web" href="https://www.electronics.jtekt.co.jp/en/product/plc/directlogic-405-su-2/" rel="noopener" target="_blank"><i>WEB</i><span><b>JTEKT DirectLOGIC 405 (영문)</b><small>JTEKT 공식 — 제품 페이지</small></span></a></div></div><div class="dg dg-kns"><h3>한국케이앤에스(주) 자료실<span></span><em>1</em></h3><div class="dl"><a class="dk dk-kns" href="/59"><i>KNS</i><span><b>자료실 — 카탈로그</b><small>한국케이앤에스(주) 자료실</small></span></a></div></div></div></section></div>
<section class="box blk faq"><h2>자주 묻는 질문</h2><details><summary>DL405는 단종됐습니까?</summary><p>AutomationDirect는 DL405를 기존 설비를 위해 지원하는 레거시 PLC 시리즈로 표시하고 신규 적용에는 다른 시리즈를 권장하지만, 이는 시리즈 방침이며 형번별 단종 표기는 아닙니다. 이 분류에서는 D4-EE-2(Retired 2024-07)와 D4-RSDC(Retired 2018-10)가 단종이고, D4-08TA · F4-04DAS-1 · D4-RM · D4-RS · D4-DCM은 AutomationDirect가 재고 소진 후 단종 예정으로 표기하며, H4-EBC는 JTEKT 폐지 표에 올라 있습니다. AutomationDirect의 시리즈 방침 문서(일자 미표기)는 DL05/06/205/405를 가능한 오래 공급하는 데 집중하되 신기능은 추가하지 않는다고 밝히고, JTEKT는 D4-454 · D4-454DC-1을 SU 시리즈의 후속 CPU로 안내합니다.</p></details><details><summary>KOYO U- 형번과 D4- 형번은 어떻게 대응합니까?</summary><p>AutomationDirect 공식 교차 참조표(support.automationdirect.com/docs/xref.html)에 입출력 · 통신 모듈의 대응이 실려 있어(예: D4-16ND2 = U-05N, D4-16TD1 = U-15T, D4-RM = U-02RM) 표의 비고 칸에 그대로 옮겼습니다. 교차 참조표에 KOYO 형번이 없는 CPU · F4- · H4- 모듈은 표시하지 않았고, 베이스는 JTEKT 일문 페이지의 현행 베이스 표기(U-14B · U-16B · U-18B)와 대응이 확인되지 않아 표시하지 않았습니다.</p></details><details><summary>모듈을 추가할 때 무엇을 먼저 확인합니까?</summary><p>5 V 전력 예산과 슬롯 제한입니다. D4-454 · D4-454DC-1은 베이스에 5 V 3,100 mA를, 확장 유닛 D4-EX · D4-EXDC는 4,000 mA를 공급하며(DL405 매뉴얼 전력 예산 표) 모듈 소비 전류의 합이 이를 넘으면 안 됩니다. 64점 모듈(D4-64ND2 · D4-64TD1)은 CPU 베이스 전용이고 사용하면 슬롯 5 · 6 · 7에 특수 모듈을 둘 수 없습니다. 아날로그 · 열전대 모듈의 외부 전원 전류는 자료마다 표기가 다른 경우가 있으므로 각 행의 전원 칸을 함께 확인하십시오.</p></details></section>
<p class="src">자료 출처: AutomationDirect 제품 페이지 · 사양서 · 컷시트 · 사용자 매뉴얼(DL405 · D4-454 · 아날로그 I/O · D4-DCM) · 형번 교차 참조표 · 시리즈 방침 문서, JTEKT ELECTRONICS 제품 페이지(일문 · 영문) 조회 2026-10-13~14. 사양은 사양서의 동작 범위를 앞에 두고, 컷시트 · 제품 페이지의 공칭 값이나 다른 자료와 값이 다른 경우는 행의 주요 특징 또는 참고 줄에 함께 적었습니다. 사용 온도는 모듈 사양서에 있으면 그 값을, 없으면 DL405 사용자 매뉴얼 ch2(p.2-8)의 시스템 공통 사양을 썼습니다(모듈에 따라 주위 온도별 출력 전류 감액이 있음). 값이 없는 칸은 "데이터시트 참조"로 남겼습니다. 확인한 AutomationDirect 제품 페이지에는 UL Listed 파일 번호가 있으나 CE는 None으로 표기되어 있고 홈 타일에도 이 분류의 인증 마크가 없어, 마크는 표시하지 않았습니다. KOYO 형번은 AutomationDirect 교차 참조표 기준입니다. 프로토타입 — 실제 적용 전 형번별 최신 자료와 다시 대조합니다.</p>

(function () {
  'use strict';
  function validate(container) {
    if (!container) return false;
    var first = null;
    container.querySelectorAll('input[data-k="q"]').forEach(function (input) {
      var n = Number(input.value);
      var ok = input.value.trim() !== '' && Number.isSafeInteger(n) && n >= 1;
      input.setCustomValidity(ok ? '' : '수량은 1 이상의 정수로 입력해 주세요.');
      input.setAttribute('aria-invalid', String(!ok));
      if (!ok && !first) first = input;
    });
    var error = container.querySelector('.v79-error');
    if (!error) {
      error = document.createElement('p');
      error.className = 'v79-error';
      error.setAttribute('role', 'alert');
      (container.querySelector('.qft') || container).appendChild(error);
    }
    error.textContent = first ? '수량은 1 이상의 정수로 입력해 주세요.' : '';
    if (first) {
      first.focus();
      first.reportValidity();
      return false;
    }
    return true;
  }
  window.KQ79 = {validate: validate};
  document.addEventListener('input', function (e) {
    if (e.target.matches('#qm [data-k=q],#bk [data-k=q]')) {
      e.target.setCustomValidity('');
      e.target.removeAttribute('aria-invalid');
      var box = e.target.closest('#qm,#bk');
      var error = box.querySelector('.v79-error');
      if (error) error.textContent = '';
    }
  });
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-act=request]');
    if (!link) return;
    e.preventDefault();
    var modal = document.getElementById('qm');
    if (!modal.querySelector('[data-k=q]') || !validate(modal)) return;
    // 문의서에서 다시 열어 수정해도 이미 입력한 담당자/연락처는 보존한다.
    var form = document.getElementById('inqf');
    if (form) {
      KQ.close();
      document.getElementById('done').classList.remove('show');
      document.getElementById('inqw').hidden = false;
      form.scrollIntoView({behavior: 'smooth', block: 'start'});
    } else {
      location.href = link.getAttribute('href');
    }
  });
