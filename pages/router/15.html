v class="bd"&gt;&lt;h3&gt;트레이 패커 규격 전환 — 기계의 90 ~ 95 %가 규격 전환&lt;/h3&gt;&lt;div class="cu"&gt;SOMIC (포장기계)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;랩어라운드 · 트레이 패커의 다양한 포장 규격을 유연하고 확실하게 전환해야 함&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;전자식 위치 표시기 AP05를 기계 제어에 통합 — 레시피 목표값 전송, 적 / 녹 LED와 방향 화살표, 공구 없는 Quick Change&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;전환 시간 단축, 재기동 전 오설정 배제, 배치별 설정 데이터 기록 · 고객의 약 50 %가 전자식 채택&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/101#s=AP05"&gt;AP05&lt;/a&gt;&lt;a href="/101#s=DA09S"&gt;기계식 DA 계열&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/packaging-machine-manufacturer-somic-relies-on-ap05-electronic-position-indicators-from-siko" rel="noopener" target="_blank"&gt;SIKO 사례 (2020-04)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="pharma pack" data-pages="indicator actuator" id="siko-pharma"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-pharma.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;제약 · 의료&lt;/span&gt;&lt;span&gt;포장 · 식품 · 음료&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;라벨러에 장착된 위치 표시기 · 포지셔닝 드라이브 (도해) · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;제약 포장 — 수동 · 모니터링 · 자동 3단계 포맷 전환&lt;/h3&gt;&lt;div class="cu"&gt;고객사 비공개 (SIKO 기술 기사)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;규제 · 소량 다품종 · 수동 설정 오류 — 카토너 · 라벨러 · Track &amp;amp; Trace 직렬화 설비의 긴 전환 시간&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;수동(기계식 · 전자식 표시기) → 모니터링(버스 연결, PLC가 전 축 일치 확인 후 생산 허가) → 자동(일체형 포지셔닝 드라이브)&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;재현성 · 셋업 단축 · 인적 오류 감소, 전류 · 온도 진단으로 예지보전&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/101#s=AP05"&gt;AP05&lt;/a&gt;&lt;a href="/101#s=AP10"&gt;AP10&lt;/a&gt;&lt;a href="/95#s=AG05 Fieldbus"&gt;AG05&lt;/a&gt;&lt;a href="/95#s=AG24 Industrial Ethernet"&gt;AG24&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/pharma-40-with-intelligent-size-changeover" rel="noopener" target="_blank"&gt;SIKO 기술 기사 (2021-04)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="wood" data-pages="linear" id="siko-striebig"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-striebig.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;목공 · 패널 가공&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;Striebig Edition 60 수직 패널쏘 · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;수직 패널쏘 디지털 측정 시스템 — 2인 작업을 1인으로&lt;/h3&gt;&lt;div class="cu"&gt;Striebig AG (스위스, 패널쏘 제조)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;패널 하단 트리밍 시 2인 작업, 하강 장치 오프셋을 표준 표시기가 처리하지 못함&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;MA502(단종) 측정 표시기를 맞춤 펌웨어로(오프셋 · 기동 시 레퍼런싱 · 경고 메시지) + MS500 자기식 센서, RS485&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;1인 작업, 톱날 영역에서 손 분리, 칩 · 분진에 강한 자기식 측정, 0.1 mm 미세 조정&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/971094399#s=MS500"&gt;MS500&lt;/a&gt;&lt;a href="/971094399#s=MA504"&gt;MA 계열 표시기&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/siko-supplies-new-digital-measuring-system-for-vertical-panel-saw-edition-60-from-striebig-ag" rel="noopener" target="_blank"&gt;SIKO 사례 (2022-04)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="auto" data-pages="actuator" id="siko-braun"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-braun.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;자동차 · 부품 가공&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;자동차용 전기모터 최종 조립라인 · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;전기모터 조립라인 수동 워크스테이션의 포맷 전환 자동화&lt;/h3&gt;&lt;div class="cu"&gt;Braun Sondermaschinen GmbH&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;다품종 소량으로 포맷 전환이 잦고, 서보모터는 컴팩트 · 수동 조작 측면에서 불리&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;포지셔닝 드라이브 AG24(14 Nm · 중공축 · EtherCAT)를 워크스테이션에 장착 — 모터 · 센서 · 전자부 일체로 PLC 직결&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;PLC 프로그래밍 축소 · 전환 시간 단축, 무전원 절대위치, 전류 · 온도 진단으로 예지보전&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/95#s=AG24 Industrial Ethernet"&gt;AG24&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/braun-sondermaschinen-gmbh-relies-on-high-performance-positioning-drives-from-siko" rel="noopener" target="_blank"&gt;SIKO 사례 (2021-06)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="mobile" data-pages="absolute" id="siko-franki"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-franki.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;건설기계 · 크레인 · 모바일&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;대형 건설 현장의 Franki 파일 드라이버 · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;파일 드라이버 윈치 3개의 위치 감시 — 240톤 인장 · 6.5톤 해머 충격&lt;/h3&gt;&lt;div class="cu"&gt;Stump-Franki Spezialtiefbau GmbH (특수 토목)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;자유낙하 해머의 충격 · 진동 아래서 윈치 위치를 정밀 · 이중으로 검출해야 함&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;안전 앱솔루트 멀티턴 엔코더 WV58MR 3대 — 2중 센서 회로(PL d), 기준 주행 없는 절대 위치, 엔드 포지션 리밋&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;무전원 상태에서도 위치 파악, 충격 · 진동 내성 — "엔코더의 견고함만은 바꾸지 말아 달라"(고객 인용)&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/217#s=WV58MR"&gt;WV58MR&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/safety-rotary-encoders-from-siko-for-pile-drivers-in-specialist-civil-engineering" rel="noopener" target="_blank"&gt;SIKO 사례 (2022-07)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="mobile" data-pages="absolute" id="siko-aurora"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-aurora.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;건설기계 · 크레인 · 모바일&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;사과 과수원을 주행하는 AurOrA · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;과수원 자율주행 수확 보조차량 — 조향각 · 홀더 위치&lt;/h3&gt;&lt;div class="cu"&gt;hochschule 21 · PWH (독일, 연구 과제 AurOrA)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;진흙 · 먼지 · 비 · 요철에서 조향각과 과일상자 홀더 위치를 검출하고, 전원 차단 후에도 영점 유지&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;PURE.MOBILE 앱솔루트 엔코더(WV5800M · AH25S) — 전원 복귀 후에도 조향각 유지, 협소 공간용 소형 센서&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;경로 이탈 없는 주행, 수확 노동 부담 경감 · 후속 차량에는 안전형 WV58MR 적용 예정&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/217#s=WV58MR"&gt;WV58MR (후속 적용 예정) · WV5800M · AH25S는 문의&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/siko-supports-development-project-for-autonomously-operating-harvesting-vehicle-in-fruit-orchards" rel="noopener" target="_blank"&gt;SIKO 사례 (2022-09)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="semi" data-pages="linear" id="siko-schunk"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-schunk.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;반도체 · 전자&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;Schunk PCB 디패널링 머신 · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;PCB 디패널링 머신 — SIL2 자기식 리니어 센서를 제어기에 직결&lt;/h3&gt;&lt;div class="cu"&gt;Schunk Electronic Solutions&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;Siemens 제어기의 DRIVE-CLiQ에 기존 SSI 엔코더는 컨버터가 필요 — 배선 · 비용&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;MagLine 앱솔루트 자기식 센서 MSA111C(SIL2, DRIVE-CLiQ 직결) 공동 개발 — 플러그 앤 플레이, 기준 주행 불필요&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;비용 절감, 자동 인식 · 설정, 정확도 ±10 µm · 반복 ≤2 µm · 분해능 1 µm, 분진 내성&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/971094399#s=MSA111C"&gt;MSA111C&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/magnetic-sensor-ensures-safety-features-in-depaneling-machines" rel="noopener" target="_blank"&gt;SIKO 사례 (2016-06)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="SIKO" data-ind="" data-pages="wire" id="siko-moco"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/siko-moco.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;영화 특수효과 · 유압 모션&lt;/span&gt;&lt;span class="br"&gt;SIKO&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;"Fantastic Beasts" 12 m 보트 갑판 유압 플랫폼 · 사진 © SIKO&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;영화 특수효과 유압 모션 플랫폼 — 실린더 스트로크 · 다중 실린더 동기화&lt;/h3&gt;&lt;div class="cu"&gt;Absolute MoCo (영국) · Absolute Effects&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;보트 갑판 · 마차 · 기관차 플랫폼을 자연스럽고 안전하게 움직이려면 각 유압 실린더의 위치 · 속도를 정확히 재고 여러 실린더를 동기화해야 함 — 협소 공간, 빠른 센서 교체&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;실린더 내장형 와이어 엔코더 SGH10(피스톤 드릴링 불필요), 기존 구조물에는 외장형 SG10 · SG20(최대 2000 mm)&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;반복 촬영 가능한 정밀 동작, 안전 정지, 드릴링 비용 절감 · 빠른 센서 교체 — Fantastic Beasts: The Crimes of Grindelwald · Midnight Sky 촬영에 사용(제조사 기사)&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/181996915#s=SGH10"&gt;SGH10&lt;/a&gt;&lt;a href="/181996915#s=SG10"&gt;SG10&lt;/a&gt;&lt;a href="/181996915#s=SG20"&gt;SG20&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.siko-global.com/en/newsroom/news-details/position-sensors-from-siko-are-used-for-special-effects-in-marvel-warner-brothers-blockbusters" rel="noopener" target="_blank"&gt;SIKO 사례 (2021-10)&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="ReeR" data-ind="pack" data-pages="safety-relay light-curtain" id="reer-cheese"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-cheese.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;포장 · 식품 · 음료&lt;/span&gt;&lt;span class="br"&gt;ReeR&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;회전 테이블식 치즈 포셔닝 머신 · 사진 © ReeR&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;치즈 포셔닝 머신 — 기능 안전 통합&lt;/h3&gt;&lt;div class="cu"&gt;Facchinetti Srl (이탈리아, 기계 제조) · 인테그레이터 AutomationPlus&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;규격 준수 · 작업자 보호 · 생산 연속성을 동시에 만족하는 안전 설계&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;안전 컨트롤러 MOSAIC M1 + 안전 라이트커튼 EOS4로 안전 기능 통합&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;제조사가 "functional safety case study"로 공개한 식품 가공 기계 안전 설계 사례&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/174#s=M1"&gt;MOSAIC M1&lt;/a&gt;&lt;a href="/173#s=EOS4 A/AH"&gt;EOS4&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.reersafety.com/en/applications/food-beverage/" rel="noopener" target="_blank"&gt;ReeR Applications — Food &amp;amp; Beverage&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="ReeR" data-ind="logi" data-pages="light-curtain sensor" id="reer-modula"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-modula.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;물류 · 자동창고&lt;/span&gt;&lt;span class="br"&gt;ReeR&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;Modula 수직 자동창고 · 사진 © ReeR&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;수직 자동창고 Modula Lift — 안전 + 높이 측정을 한 시스템으로&lt;/h3&gt;&lt;div class="cu"&gt;Modula S.p.A. (이탈리아, 자동창고)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;기계 구조 안에 들어가는 얇은 안전 라이트커튼 + 트레이 적재물 최대 높이를 빠른 이동 중 측정&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;안전: EOS2 마스터 · 슬레이브(30 mm)를 L자 배치 / 측정: MICRON MI 752 D B(25 mm) — 4 mm 물체 검출, 반사면 영향 없음&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;트레이 좌 · 우 · 중앙 균일 판독, 맞춤 시리얼 프로토콜로 제어기 연동&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/173#s=EOS2 XM/XS/XS2"&gt;EOS2&lt;/a&gt;&lt;a href="/339#s=MICRON B"&gt;MICRON 측정 라이트커튼&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.reersafety.com/wp-content/uploads/2021/09/Vertical-Storage.pdf" rel="noopener" target="_blank"&gt;ReeR 응용 노트 PDF&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="ReeR" data-ind="infra logi" data-pages="light-curtain" id="reer-brisbane"&gt;&lt;div class="im"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-brisbane.jpg"/&gt;&lt;div class="tg"&gt;&lt;span&gt;인프라 · 에너지 · 공공설비&lt;/span&gt;&lt;span&gt;물류 · 자동창고&lt;/span&gt;&lt;span class="br"&gt;ReeR&lt;/span&gt;&lt;/div&gt;&lt;div class="cap"&gt;Port of Brisbane 컨테이너 야드 · 사진 © ReeR&lt;/div&gt;&lt;/div&gt;&lt;div class="bd"&gt;&lt;h3&gt;항만 컨테이너 야드 외곽 보호 — 옥외 대면적 출입 통제&lt;/h3&gt;&lt;div class="cu"&gt;Port of Brisbane AutoStrad Terminal (호주)&lt;/div&gt;&lt;dl class="pse"&gt;&lt;div&gt;&lt;dt&gt;과제&lt;/dt&gt;&lt;dd&gt;브리지 크레인 · 자율주행 차량 구역(Container Handling and Storage Area)에 인원 출입 차단&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;해결&lt;/dt&gt;&lt;dd&gt;Admiral WTH 라이트커튼 + 장거리 듀얼빔 + 펜스 · 인터록 게이트&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;효과&lt;/dt&gt;&lt;dd&gt;옥외 가혹 환경의 대면적 외곽에서 출입 제한 달성&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="pr"&gt;&lt;span class="l"&gt;관련 제품군 · 선정표 (당사 취급)&lt;/span&gt;&lt;a href="/173#s=ADMIRAL WT/WTH"&gt;ADMIRAL WTH&lt;/a&gt;&lt;/div&gt;&lt;div class="sr2"&gt;출처: &lt;a href="https://www.reersafety.com/wp-content/uploads/2022/11/WP_AN25_Perimetral-protection-in-harsh-environment_ENG.pdf" rel="noopener" target="_blank"&gt;ReeR 응용 노트 AN25&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class="cc" data-brand="ReeR" data-ind="auto" data-pages="safety-relay" id="reer-ded"&gt;&lt;div class="im ph"&gt;&lt;
