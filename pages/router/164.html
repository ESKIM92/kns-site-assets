&lt;div class="tx"&gt;&lt;p class="ey"&gt;제품 › 세이프티&lt;/p&gt;&lt;h1&gt;세이프티&lt;small&gt;Machine Safety&lt;/small&gt;&lt;/h1&gt;
&lt;p class="ds"&gt;위험 구역 접근을 감지하는 안전 라이트커튼, 안전 기기 신호를 받아 설비를 멈추는 안전 릴레이 · 안전 컨트롤러, 방호문 개폐를 검출 · 잠그는 안전 스위치 · 인터락, 비접촉 안전 센서 · 안전 엔코더입니다. 위험성 평가로 정한 안전 등급에 맞춰 아래 제품군에서 고르세요.&lt;/p&gt;&lt;/div&gt;
&lt;div class="act"&gt;&lt;a class="btn b1" href="/173"&gt;라이트커튼 선정표&lt;/a&gt;&lt;a class="btn b2" href="#guide"&gt;고르는 법&lt;/a&gt;&lt;a class="btn b2" href="/210"&gt;안전 스위치 선정표&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class="box blk"&gt;&lt;h2&gt;제품군&lt;/h2&gt;
&lt;div class="g4"&gt;
&lt;a class="hc" href="/173"&gt;&lt;div class="hi"&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/light-curtain-338.png"/&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/light-curtain-393.png"/&gt;&lt;/div&gt;&lt;div class="hb"&gt;&lt;h3&gt;라이트커튼 · 안전 라이트 커튼&lt;/h3&gt;&lt;p class="hd"&gt;위험 구역 접근을 빛으로 감지 — ReeR&lt;/p&gt;&lt;dl class="hs"&gt;&lt;div&gt;&lt;dt&gt;등급&lt;/dt&gt;&lt;dd&gt;Type 4 · PL e / Type 2 · PL c&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;분해능&lt;/dt&gt;&lt;dd&gt;14 · 20 · 30 · 40 · 50 · 90 mm · 멀티빔&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;환경&lt;/dt&gt;&lt;dd&gt;IP67 · IP69K · 고진동 · ATEX&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="sr"&gt;&lt;span&gt;EOS4 A/AH&lt;/span&gt;&lt;span&gt;EOS4 X/XH&lt;/span&gt;&lt;span&gt;EOS4 WTF/WTHF&lt;/span&gt;&lt;span&gt;EOS2 A&lt;/span&gt;&lt;span&gt;EOS2 X&lt;/span&gt;&lt;span&gt;ADMIRAL AD&lt;/span&gt;&lt;span&gt;ADMIRAL AX&lt;/span&gt;&lt;span&gt;JANUS MI&lt;/span&gt;&lt;span&gt;VISION V&lt;/span&gt;&lt;/div&gt;&lt;p class="hcase"&gt;&lt;i&gt;적용 사례 4건&lt;/i&gt;&lt;span&gt;Facchinetti Srl · Modula S.p.A. 외&lt;/span&gt;&lt;/p&gt;&lt;p class="go"&gt;선정표 보기 ›&lt;/p&gt;&lt;/div&gt;&lt;/a&gt;
&lt;a class="hc" href="/174"&gt;&lt;div class="hi"&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-relay-364.png"/&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-relay-383.png"/&gt;&lt;/div&gt;&lt;div class="hb"&gt;&lt;h3&gt;안전 릴레이 · 안전 컨트롤러&lt;/h3&gt;&lt;p class="hd"&gt;안전 기기 신호를 받아 설비를 멈춤 — ReeR · Banner&lt;/p&gt;&lt;dl class="hs"&gt;&lt;div&gt;&lt;dt&gt;입력 기기&lt;/dt&gt;&lt;dd&gt;비상정지 · 안전 스위치 · 라이트 커튼 · 양수 조작 · 속도&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;등급&lt;/dt&gt;&lt;dd&gt;PL e · Cat. 4 / PL e · Cat. 3 (형번별)&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;컨트롤러&lt;/dt&gt;&lt;dd&gt;MOSAIC · SC26 · XS26 · SC10-2&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="sr"&gt;&lt;span&gt;SR ONE (구 AD SR1)&lt;/span&gt;&lt;span&gt;SR ONE M (구 AD SRM)&lt;/span&gt;&lt;span&gt;AD SRE4 - AD SRE4C&lt;/span&gt;&lt;span&gt;AD SRE3 - AD SRE3C&lt;/span&gt;&lt;span&gt;AD SRT&lt;/span&gt;&lt;span&gt;M1&lt;/span&gt;&lt;span&gt;MI8/MI16/MI12T8&lt;/span&gt;&lt;span&gt;SC26&lt;/span&gt;&lt;span&gt;XS26&lt;/span&gt;&lt;/div&gt;&lt;p class="hcase"&gt;&lt;i&gt;적용 사례 4건&lt;/i&gt;&lt;span&gt;Facchinetti Srl · Algus Packaging Inc. 외&lt;/span&gt;&lt;/p&gt;&lt;p class="go"&gt;선정표 보기 ›&lt;/p&gt;&lt;/div&gt;&lt;/a&gt;
&lt;a class="hc" href="/210"&gt;&lt;div class="hi"&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-switch-513.png"/&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-switch-505.png"/&gt;&lt;/div&gt;&lt;div class="hb"&gt;&lt;h3&gt;안전 스위치 · 인터락 · 방폭&lt;/h3&gt;&lt;p class="hd"&gt;방호문 개폐를 검출하고 잠금 — IDEM · Banner&lt;/p&gt;&lt;dl class="hs"&gt;&lt;div&gt;&lt;dt&gt;방식&lt;/dt&gt;&lt;dd&gt;힌지 · 텅 인터락 · RFID 가드 로킹 · 트랩키 · 로프풀&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;재질 · 보호&lt;/dt&gt;&lt;dd&gt;폴리에스터 · 다이캐스트 · 316 SS / IP67 · IP69K&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;방폭&lt;/dt&gt;&lt;dd&gt;ATEX · IECEx (국내 사용 시 KCs 별도 확인)&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="sr"&gt;&lt;span&gt;HSM&lt;/span&gt;&lt;span&gt;HSM-Z&lt;/span&gt;&lt;span&gt;HS-SS&lt;/span&gt;&lt;span&gt;MGL-P&lt;/span&gt;&lt;span&gt;MGL-SS&lt;/span&gt;&lt;span&gt;M-MV · SS-MV&lt;/span&gt;&lt;span&gt;SS-TS-SR&lt;/span&gt;&lt;span&gt;M-TS-CB&lt;/span&gt;&lt;span&gt;RP-LM40&lt;/span&gt;&lt;span&gt;GLS-Ex · GLHD-Ex&lt;/span&gt;&lt;span&gt;HLM-SS-Ex · HLM-Ex&lt;/span&gt;&lt;/div&gt;&lt;p class="hcase"&gt;&lt;i&gt;적용 사례 3건&lt;/i&gt;&lt;span&gt;제조사 · 당사 공개 사례&lt;/span&gt;&lt;/p&gt;&lt;p class="go"&gt;선정표 보기 ›&lt;/p&gt;&lt;/div&gt;&lt;/a&gt;
&lt;a class="hc" href="/175"&gt;&lt;div class="hi"&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-sensor-374.png"/&gt;&lt;img alt="" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/hub/safety-sensor-376.png"/&gt;&lt;/div&gt;&lt;div class="hb"&gt;&lt;h3&gt;비접촉 안전 센서 · 안전 엔코더&lt;/h3&gt;&lt;p class="hd"&gt;문 개폐를 비접촉으로 검출 · 회전 속도를 안전 등급으로 감시 — ReeR&lt;/p&gt;&lt;dl class="hs"&gt;&lt;div&gt;&lt;dt&gt;검출&lt;/dt&gt;&lt;dd&gt;코드화 자석(MG) · RFID&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;속도 감시&lt;/dt&gt;&lt;dd&gt;SAFECODER 안전 엔코더&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;등급&lt;/dt&gt;&lt;dd&gt;연결 모듈 · 컨트롤러와의 조합 기준&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class="sr"&gt;&lt;span&gt;MAGNUS RFID&lt;/span&gt;&lt;span&gt;MAGNUS MG&lt;/span&gt;&lt;span&gt;SAFECODER&lt;/span&gt;&lt;/div&gt;&lt;p class="go"&gt;선정표 보기 ›&lt;/p&gt;&lt;/div&gt;&lt;/a&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;세이프티 고르는 법&lt;/h2&gt;&lt;p class="lead"&gt;안전 등급 → 보호 방식 → 신호를 받는 장치 순으로 정해집니다.&lt;/p&gt;
&lt;div class="g3"&gt;
&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;요구 안전 등급은?&lt;/h3&gt;&lt;p&gt;위험성 평가(ISO 13849-1)에서 요구된 PL · Cat.에 맞춥니다. 라이트커튼은 Type 4 · PL e 또는 Type 2 · PL c, 릴레이 · 스위치도 형번마다 등급이 달라 선정표의 등급 열로 확인합니다.&lt;/p&gt;&lt;/div&gt;
&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;무엇을 보호하나요?&lt;/h3&gt;&lt;p&gt;개방된 위험 구역의 접근 감지 → 라이트커튼. 방호문(가드) 개폐 검출 · 잠금 → 안전 스위치 · 인터락 또는 비접촉 안전 센서. 축 회전 속도 감시 → 안전 엔코더. 폭발성 분위기는 방폭 형번과 구역(Zone)을 확인하고 국내 사용 시 KCs를 별도 확인합니다.&lt;/p&gt;&lt;/div&gt;
&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;신호를 어디서 받나요?&lt;/h3&gt;&lt;p&gt;안전 기기 출력은 안전 릴레이가 받아 설비를 멈춥니다. 기기 수가 많거나 로직 변경이 잦으면 프로그래머블 안전 컨트롤러(MOSAIC · SC26 · XS26 · SC10-2)로 올립니다. 최종 안전 등급은 기기와 연결 장치의 조합으로 정해집니다.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
