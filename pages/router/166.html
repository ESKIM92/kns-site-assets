&lt;div class="tx"&gt;&lt;p class="ey"&gt;PLC › 중형 PLC (DL205)&lt;/p&gt;
&lt;h1&gt;중형 PLC · DirectLOGIC DL205&lt;small&gt;DirectLOGIC DL205 Mid-size PLC Modules&lt;/small&gt;&lt;/h1&gt;
&lt;div class="kin"&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;무엇&lt;/span&gt;&lt;p&gt;JTEKT(구 KOYO) &lt;b&gt;DirectLOGIC DL205 중형 PLC&lt;/b&gt;의 CPU · 베이스 · 입출력 · 아날로그 · 특수 모듈&lt;/p&gt;&lt;/div&gt;&lt;details class="kdt" open=""&gt;&lt;summary&gt;고르는 순서 · 참고 보기&lt;/summary&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;고르는 순서&lt;/span&gt;&lt;ol class="kst"&gt;&lt;li&gt;&lt;span class="n"&gt;1&lt;/span&gt;&lt;b&gt;CPU · 베이스&lt;/b&gt;&lt;small&gt;D2-263 · D2-265 / 3 · 4 · 6 · 9슬롯, AC · DC 전원&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;2&lt;/span&gt;&lt;b&gt;입출력 종류 · 점수&lt;/b&gt;&lt;small&gt;DC · AC 입력 / DC · AC · 릴레이 출력, 4 ~ 32점&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;3&lt;/span&gt;&lt;b&gt;아날로그 · 온도&lt;/b&gt;&lt;small&gt;전류 · 전압 · 절연형 · RTD · 열전대, 2 ~ 8채널&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;4&lt;/span&gt;&lt;b&gt;통신 · 카운터&lt;/b&gt;&lt;small&gt;이더넷 · 시리얼 · 고속 카운터&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;5&lt;/span&gt;&lt;b&gt;5 V 전류 예산&lt;/b&gt;&lt;small&gt;베이스 공급 2,600 mA 이내인지 확인&lt;/small&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;참고&lt;/span&gt;&lt;p class="kn"&gt;기존 D2-260 · D2-250-1 CPU는 제조사가 단종했고 D2-263 · D2-265가 후속입니다. 자료끼리 값이 다른 항목은 행의 참고 줄에 '출처 상충'으로 두 값을 함께 적었습니다.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;p class="lvnote" id="lvnote"&gt;사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.&lt;/p&gt;
&lt;p id="tvnote" style="font-size:12.5px;color:#5E6B78;padding:10px 16px"&gt;행을 누르면 전원 · 사용 온도 · 특징 · 자료 출처가 펼쳐집니다. 사양은 대표값이며 형번(옵션)에 따라 다릅니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다.&lt;/p&gt;

&lt;div data-pane="guide" hidden=""&gt;&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;중형 PLC · DirectLOGIC DL205 선정 가이드&lt;/h2&gt;&lt;p class="lead"&gt;아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.&lt;/p&gt;&lt;div class="g4"&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;CPU 선택&lt;/h3&gt;&lt;p&gt;현행 CPU는 D2-263(시리얼 2포트 · 플래시 메모리 · 백업 전지는 시판 CR2354)과 D2-265(이더넷 / FL-net 포트 내장 · MRAM이라 전지 불필요)입니다. 기존 D2-250-1 · D2-260은 제조사가 단종했으므로 '단종 · 후속' 탭에서 후속 형번을 확인하십시오.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;베이스와 슬롯 수&lt;/h3&gt;&lt;p&gt;베이스는 CPU 슬롯을 포함해 3 · 4 · 6 · 9슬롯이고 전원이 AC 100/200 V형(D2-0xB-1)과 DC 12/24 V형(D2-0xBDC1-1)으로 나뉩니다. 5 V는 베이스마다 2,600 mA를 공급하고 보조 24 V 300 mA는 AC형만 제공합니다. 슬롯이 모자라면 D2-CM · D2-EM으로 확장 베이스를 최대 4대(CPU 베이스 포함 5대)까지 늘릴 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;입출력 · 아날로그 · 특수 모듈&lt;/h3&gt;&lt;p&gt;디지털은 입력(DC 싱크/소스 겸용 · AC)과 출력(DC 싱크 · DC 소스 · AC · 릴레이) 중에서 부하 전압과 점당 전류로 고릅니다. 아날로그는 전류 · 전압, 입력 · 출력 · 혼합, 절연형, 온도(RTD · 열전대)로, 통신 · 카운터는 이더넷 · 시리얼 · 고속 카운터 모듈로 나뉩니다. 행을 펼치면 나오는 '출처 상충' 참고는 자료끼리 값이 달라 주문 전 확인이 필요한 항목입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;4&lt;/span&gt;&lt;h3&gt;전류 예산과 점수 확인&lt;/h3&gt;&lt;p&gt;CPU와 모듈의 5 V 소비전류를 모두 더해 베이스 공급량 2,600 mA 이내인지 확인합니다. 외부 전원이 필요한 모듈은 24 V 전원 용량을 따로 계산하고, 아날로그 · 특수 모듈이 쓰는 입출력 점수(X · Y 점)도 CPU 최대 점수(확장 포함 합계 1,536점)에 넣어 따져 보십시오.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="disc" hidden=""&gt;&lt;section class="box blk" id="disc"&gt;&lt;h2&gt;단종 상품 · 후속 형번&lt;/h2&gt;&lt;p class="lead"&gt;제조사 단종 안내 기준입니다. 단종 문의도 받습니다 — 후속 · 대체 제품으로 안내해 드립니다.&lt;/p&gt;&lt;table class="kt"&gt;&lt;tr class="gh"&gt;&lt;th&gt;단종 형번&lt;/th&gt;&lt;th&gt;제조사&lt;/th&gt;&lt;th&gt;시기&lt;/th&gt;&lt;th&gt;후속 · 대체&lt;/th&gt;&lt;th&gt;근거&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;D2-260&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;2021-06 (AutomationDirect 표기 Retired 06/2021)&lt;/td&gt;&lt;td&gt;D2-263 · D2-265 (JTEKT 일문 폐지 표 기재, 영문 폐지 표는 D2-263만 기재) · AutomationDirect 단종 안내문은 D2-262&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.automationdirect.com/pn/D2-260" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;D2-250-1&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;2021-12 (AutomationDirect 표기 Retired 12/2021)&lt;/td&gt;&lt;td&gt;D2-263 · D2-265 (JTEKT 일문 폐지 표 기재, 영문 폐지 표는 D2-263만 기재 · 카탈로그 p.191은 D2-263이 D2-250 · D2-250-1 · D2-260의 후속이라고 기재) · AutomationDirect 단종 안내문은 D2-262&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.automationdirect.com/pn/D2-250-1" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;F2-02DA-1L&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;2018-10 (AutomationDirect 표기 Retired 10/2018)&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토 (AutomationDirect는 대체품 없음으로 표기 · -1L은 외부 12 V 전원형이라 현행 F2-02DA-1과 전원 조건이 다름). JTEKT 영문 · 일문 페이지는 -1L을 현행 목록에 게재 — 출처 상충&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.automationdirect.com/pn/F2-02DA-1L" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;F2-02DA-2L&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;2019-02 (AutomationDirect 표기 Retired 02/2019)&lt;/td&gt;&lt;td&gt;AutomationDirect 매뉴얼 안내: F2-02DA-2로 대체 검토 (JTEKT 후속 표기 없음 · -2L은 외부 12 V 전원형). JTEKT 영문 · 일문 페이지는 -2L을 현행 목록에 게재 — 출처 상충&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.automationdirect.com/pn/F2-02DA-2L" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;D2-CTRINT (카운터 인터페이스 모듈)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;연월 미표기 (JTEKT 영문 제품 페이지 폐지 표 기재 · 일문 표에는 없음)&lt;/td&gt;&lt;td&gt;JTEKT 표기 유사품: H2-CTRIO2 (JTEKT 기준 단종 — AutomationDirect는 판매 중)&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/en/product/plc/directlogic-205/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="docs" hidden=""&gt;&lt;section class="box blk" id="docs"&gt;&lt;h2&gt;데이터시트 · 자료&lt;/h2&gt;&lt;p class="lead"&gt;최신 자료는 제조사 공식 페이지에서 받으실 수 있습니다. 한글 자료는 자료실에 모아 둡니다.&lt;/p&gt;

onDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/hxecomm/hxecomm.html" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;H2-ECOM100 이더넷 통신 모듈 매뉴얼 (HX-ECOM-M)&lt;/b&gt;&lt;small&gt;AutomationDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/h24ermm/h24ermm.html" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;H2-ERM100 이더넷 리모트 I/O 마스터 매뉴얼 (H2-ERM · H4-ERM)&lt;/b&gt;&lt;small&gt;AutomationDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/h24ebc/h24ebc.html" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;H2-EBC100 이더넷 베이스 컨트롤러 매뉴얼 (H24-EBC)&lt;/b&gt;&lt;small&gt;AutomationDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/hxctriom/hxctriom.html" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;H2-CTRIO2 고속 카운터 매뉴얼 (HX-CTRIO-M)&lt;/b&gt;&lt;small&gt;AutomationDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-cat" href="https://cdn.automationdirect.com/static/manuals/d2ctrif/d2ctrif.html" rel="noopener" target="_blank"&gt;&lt;i&gt;PDF&lt;/i&gt;&lt;span&gt;&lt;b&gt;D2-CTRINT 카운터 인터페이스 매뉴얼 (D2-CTRIF-M)&lt;/b&gt;&lt;small&gt;AutomationDirect 공식 — 매뉴얼&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-web"&gt;&lt;h3&gt;제조사 제품 페이지&lt;span&gt;&lt;/span&gt;&lt;em&gt;2&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-web" href="https://www.electronics.jtekt.co.jp/en/product/plc/directlogic-205/" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;DL205 (영문)&lt;/b&gt;&lt;small&gt;JTEKT 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.electronics.jtekt.co.jp/jp/product/plc/directlogic-205/" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;DL205 (일문)&lt;/b&gt;&lt;small&gt;JTEKT 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-kns"&gt;&lt;h3&gt;한국케이앤에스(주) 자료실&lt;span&gt;&lt;/span&gt;&lt;em&gt;1&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-kns" href="/59"&gt;&lt;i&gt;KNS&lt;/i&gt;&lt;span&gt;&lt;b&gt;자료실 — 카탈로그&lt;/b&gt;&lt;small&gt;한국케이앤에스(주) 자료실&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class="box blk faq"&gt;&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;D2-260 · D2-250-1 CPU는 아직 구할 수 있습니까?&lt;/summary&gt;&lt;p&gt;두 CPU는 AutomationDirect가 각각 2021년 6월(D2-260) · 12월(D2-250-1)에 단종(Retired) 처리했고 JTEKT 폐지 표에도 올라 있어, 이 페이지에서는 '단종 · 후속' 탭에 따로 안내합니다. JTEKT는 후속으로 D2-263(영문 폐지 표) 또는 D2-263 · D2-265(일문 폐지 표)를 안내하고, AutomationDirect 단종 안내문에는 D2-262가 적혀 있습니다. D2-263은 시리얼 2포트 · 플래시 메모리, D2-265는 이더넷 / FL-net 포트 내장 · MRAM(전지 불필요)이므로 사용 중인 통신 구성에 맞춰 고르십시오.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;베이스에 모듈을 몇 개까지 꽂을 수 있고, 전류는 어떻게 확인합니까?&lt;/summary&gt;&lt;p&gt;베이스는 CPU 슬롯을 포함해 3 · 4 · 6 · 9슬롯이며 CPU 슬롯을 뺀 나머지에 입출력 · 특수 모듈을 장착합니다. 베이스는 형번에 관계없이 5 V 2,600 mA를 공급하므로 CPU와 모든 모듈의 5 V 소비전류 합계가 이 값 이내여야 합니다(모듈별 값은 표의 '전원 · 5 V 소비전류' 칸, CPU 소비전류는 '데이터시트 참조'). D2-CM · D2-EM으로 확장 베이스를 최대 4대(CPU 베이스 포함 5대)까지 늘릴 수 있고 이때 합계 입출력은 1,536점입니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;표의 '출처 상충'은 무슨 뜻입니까?&lt;/summary&gt;&lt;p&gt;JTEKT 자료와 AutomationDirect 자료 사이, 또는 같은 회사의 매뉴얼과 사양서 · 컷시트 사이에 값이 달라 한쪽으로 확정하지 못한 항목입니다. 행을 펼치면 '참고' 줄에 두 값과 출처를 함께 적었고, 표에는 그중 근거가 분명한 값을 썼습니다. 주문 전에 형번별 최신 데이터시트로 다시 확인합니다.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
&lt;p class="src"&gt;자료 출처: JTEKT ELECTRONICS 공식 사이트(electronics.jtekt.co.jp)의 DirectLOGIC 205 제품 페이지(영문 · 일문)와 DL205 카탈로그(DL205_20.pdf), AutomationDirect(automationdirect.com)의 제품 페이지 · 사양서 · 컷시트 · 매뉴얼(D2-INST-M · D2-USER-M · D2-ANLG-M · D2-DCM-M 등) 조회 2026-10-14. D2-263 · D2-265는 AutomationDirect 제품 페이지를 열람하지 못해 두 CPU 행은 JTEKT 자료만 근거로 했습니다. 자료끼리 값이 다른 항목은 행의 참고 줄에 '출처 상충'으로 두 값과 출처를 함께 적었고, 제조사 자료에 값이 없는 칸은 '데이터시트 참조'로 남겼습니다. 사용 온도는 모듈 사양서에 값이 있으면 그 값을, 없으면 DL205 시스템 공통 사양(D2-INST-M)을 썼습니다. 인증 마크는 표시하지 않았습니다. 프로토타입 — 실제 적용 전 형번별 최신 자료와 다시 대조합니다.&lt;/p&gt;
&lt;/main&gt;

(function () {
  'use strict';
  function validate(container) {
    if (!container) return false;
    var first = null;
    container.querySelectorAll('input[data-k="q"]').forEach(function (input) {
      var n = Number(input.value);
      var ok = input.value.trim() !== '' &amp;&amp; Number.isSafeInteger(n) &amp;&amp; n &gt;= 1;
      input.setCustomValidity(ok ? '' : '수량은 1 이상의 정수로 입력해 주세요.');
      input.setAttribute('aria-invalid', String(!ok));
      if (!ok &amp;&amp; !first) first = input;
    });
    var error = container.querySelector('.v79-error');
    if (!error) {
      error = document.createElement('p');
      error.className = 'v79-error';
      error.setAttribute('role', 'alert');
      (container.querySelector('.qft') || container).appendChild(error);
    }
    error.textContent = first ? '수량은 1 이상의 정수로 입력해 주세요.' : '';
    if (first) {
      first.focus();
      first.reportValidity();
      return false;
    }
    return true;
  }
  window.KQ79 = {validate: validate};
  document.addEventListener('input', function (e) {
    if (e.target.matches('#qm [data-k=q],#bk [data-k=q]')) {
      e.target.setCustomValidity('');
      e.target.removeAttribute('aria-invalid');
      var box = e.target.closest('#qm,#bk');
      var error = box.querySelector('.v79-error');
      if (error) error.textContent = '';
    }
  });
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-act=request]');
    if (!link) return;
    e.preventDefault();
    var modal = document.getElementById('qm');
    if (!modal.querySelector('[data-k=q]') || !validate(modal)) return;
    // 문의서에서 다시 열어 수정해도 이미 입력한 담당자/연락처는 보존한다.
    var form = document.getElementById('inqf');
    if (form) {
      KQ.close();
      document.getElementById('done').classList.remove('show');
      document.getElementById('inqw').hidden = false;
      form.scrollIntoView({behavior: 'smooth', block: 'start'});
    } else {
      location.href = link.getAttribute('href');
    }
  });
})();
