&lt;p class="lvnote" id="lvnote"&gt;사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.&lt;/p&gt;

&lt;section class="box blk apc" id="apc"&gt;&lt;div class="aph"&gt;&lt;div&gt;&lt;h2&gt;이 제품이 쓰인 현장&lt;/h2&gt;&lt;p class="apl"&gt;제조사가 공개한 실제 적용 사례 2건 — 어떤 설비에서 무엇을 해결했는지 보고 선정에 참고하세요.&lt;/p&gt;&lt;/div&gt;&lt;a class="apall" href="/15#p=sensor"&gt;적용 사례 2건 전체 보기 ›&lt;/a&gt;&lt;/div&gt;&lt;div class="apg"&gt;&lt;a class="apk" href="/15#banner-bakery"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/banner-bakery.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;포장 · 식품 · 음료 · Banner&lt;/span&gt;&lt;b&gt;매장 내 자동 제빵기 — 분진 · 투명 액체 레벨 측정&lt;/b&gt;&lt;span class="ac2"&gt;Wilkinson Baking Company&lt;/span&gt;&lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#reer-modula"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/reer-modula.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;물류 · 자동창고 · ReeR&lt;/span&gt;&lt;b&gt;수직 자동창고 Modula Lift — 안전 + 높이 측정을 한 시스템으로&lt;/b&gt;&lt;span class="ac2"&gt;Modula S.p.A.&lt;/span&gt;&lt;span class="apb re"&gt;관련 사례&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;p class="apn"&gt;표시: &lt;span class="apb ex"&gt;적용 형번&lt;/span&gt; 사례에 그 형번이 명시됨 · &lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt; 같은 시리즈 · 계열 사용 · &lt;span class="apb re"&gt;관련 사례&lt;/span&gt; 같은 제조사의 관련 제품(당사 선정표 외 형번 포함). 사례 내용은 제조사 공개 자료 기준입니다.&lt;/p&gt;&lt;/section&gt;
&lt;section class="box blk" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#EEF5FB,#DCEBF8)"&gt;
&lt;div style="flex:1 1 420px"&gt;&lt;h2&gt;찾는 사양이 없거나 쓰시던 형번으로 바꾸고 싶으신가요?&lt;/h2&gt;&lt;p class="lead" style="color:#3D4A57"&gt;쓰시던 형번과 명판 사진을 보내 주시면 사양을 맞춰 검토 결과를 회신드립니다. 사양이 완전히 같지 않을 수 있어 비교표와 함께 제안드립니다.&lt;/p&gt;&lt;/div&gt;
&lt;div style="display:flex;gap:8px;flex-wrap:wrap"&gt;&lt;a class="btn b1" href="/substitute"&gt;대체 검토 요청&lt;/a&gt;&lt;a class="btn b2" href="/16"&gt;견적 · 기술 문의&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;div data-pane="guide" hidden=""&gt;&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;근접 · 포토 · 온도 · 칼라 · 초음파 · 레이저 · 에어리어 · 각도 센서 선정 가이드&lt;/h2&gt;&lt;p class="lead"&gt;아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.&lt;/p&gt;&lt;div class="g4"&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;검출 방식&lt;/h3&gt;&lt;p&gt;금속을 가까이서 검출하면 유도형 근접, 목재 · 수지 · 물까지 검출하면 정전용량형, 수 m 거리나 비금속 · 투명체는 포토 또는 초음파를 봅니다. 거리값 자체가 필요하면 레이저 · 초음파(아날로그)를 고릅니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;검출 · 측정 범위&lt;/h3&gt;&lt;p&gt;대상의 크기와 설치 가능한 거리에 맞는 범위를 정합니다. 표의 값은 모델 · 감지 방식 · 대상 조건별 대표값이므로(예: 레이저 거리 센서는 대상 반사율 기준) 조건을 데이터시트에서 확인하십시오.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;출력과 인터페이스&lt;/h3&gt;&lt;p&gt;상위 장비가 받는 신호에 맞춥니다 — 접점(NPN/PNP ON/OFF), 아날로그(0 ~ 10 V · 4 ~ 20 mA), 시리얼 · 버스(RS-485 · USB · CANopen · IO-Link). 같은 시리즈도 출력 방식별로 형번이 나뉩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;4&lt;/span&gt;&lt;h3&gt;환경과 전원&lt;/h3&gt;&lt;p&gt;전원(DC 10 ~ 30 V 등), 사용 온도, 보호 등급(IP50 ~ IP69K)을 확인합니다. 레이저 센서는 레이저 클래스, 에어리어 · 각도 센서는 연결할 컨트롤러 · 버스 사양을 함께 확인하십시오.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="disc" hidden=""&gt;&lt;section class="box blk" id="disc"&gt;&lt;h2&gt;단종 상품 · 후속 형번&lt;/h2&gt;&lt;p class="lead"&gt;제조사 단종 안내 기준입니다. 단종 문의도 받습니다 — 후속 · 대체 제품으로 안내해 드립니다.&lt;/p&gt;&lt;table class="kt"&gt;&lt;tr class="gh"&gt;&lt;th&gt;단종 형번&lt;/th&gt;&lt;th&gt;제조사&lt;/th&gt;&lt;th&gt;시기&lt;/th&gt;&lt;th&gt;후속 · 대체&lt;/th&gt;&lt;th&gt;근거&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;APS-30/31&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;일자 미표기&lt;/td&gt;&lt;td&gt;유사품 APS5-12GK-E (APS-30-2N · 4N, 동작 거리 5 mm로 변경) · APS10-18GK-E (APS-31-7N, 동작 거리 10 mm · 외경 M18로 변경 — 이 형번도 재고 소진 시 판매 종료, 유사품 APS7-18GMD-E)&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/jp/product/discon/sensor_discon/aps-30-31/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;APS10-18GK-E · -E2 (APS-GK의 M18 형번)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;재고 소진 시 판매 종료&lt;/td&gt;&lt;td&gt;제조사 유사품 APS7-18GMD-E (-E의 유사품) · APS7-18GMD-E2 (-E2의 유사품)&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/jp/product/sensor/sensor_01/aps-gk/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;APS-10-4T · APS-11-4T (청색 케이스)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;일자 미표기&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/en/product/sensor/sensor_01/aps-11/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;APS-12A-4T (APS-12 T형 · DC 전압 출력형)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;일자 미표기 (제조사 일본어 페이지 기준)&lt;/td&gt;&lt;td&gt;제조사 유사품 APS-13-4T (외형 치수가 다름)&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/jp/product/sensor/sensor_01/aps-10-12-13-14-15/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;CS-16-5T (DC 전압 출력형)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;일자 미표기&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/en/product/sensor/sensor_02/cs-16/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;CS-31-5T (DC 전압 출력형)&lt;/th&gt;&lt;td&gt;JTEKT&lt;/td&gt;&lt;td&gt;일자 미표기&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.electronics.jtekt.co.jp/jp/product/sensor/sensor_02/cs-31/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;IK360L&lt;/th&gt;&lt;td&gt;SIKO&lt;/td&gt;&lt;td&gt;일자 미표기 (SIKO 단종 제품 페이지)&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.siko-global.com/en/disabled-product/ik360l" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="docs" hidden=""&gt;&lt;section class="box blk" id="docs"&gt;&lt;h2&gt;데이터시트 · 자료&lt;/h2&gt;&lt;p class="lead"&gt;최신 자료는 제조사 공식 페이지에서 받으실 수 있습니다. 한글 자료는 자료실에 모아 둡니다.&lt;/p&gt;

&lt;section class="box blk faq"&gt;&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;JTEKT APS 형번에서 동작 거리는 어디서 확인하나요?&lt;/summary&gt;&lt;p&gt;카탈로그 형번표의 정격(실효) 동작 거리 칸에 mm 단위로 표기됩니다. 형번표를 보면 APS-GMC · GMD · GK · F · S · M 계열은 형번 맨 앞 숫자가 이 값과 같고(예: APS7-18GMC2-Z 7 mm, APS10-30F-E 10 mm), APS-10 ~ 15 계열은 가운데 숫자가 같습니다(예: APS-13-7N 7 mm). 출력은 -Z 2선식 NO, -E 3선식 NPN NO, -E2 3선식 PNP NO로 표기되며, 매입형 · 비매입형 구분은 해당 시리즈 카탈로그 형번표를 확인해 주십시오.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;같은 이름인데 접점형과 아날로그형이 따로 있는 이유는 무엇인가요?&lt;/summary&gt;&lt;p&gt;T30UX · T30U · S18U · QT50U · Q45U는 출력 방식(접점 ON/OFF, 아날로그 0 ~ 10 V · 4 ~ 20 mA)별로 형번이 다릅니다. 연결할 PLC · 컨트롤러 입력에 맞춰 먼저 고르십시오. Q45U는 단거리(100 mm ~ 1.4 m)와 장거리(250 mm ~ 3.0 m)도 별도 형번입니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;METRON(에어리어 센서)의 사양이 비어 있는 이유는 무엇인가요?&lt;/summary&gt;&lt;p&gt;ReeR 공식 사이트의 현행 측정용 라이트 커튼 목록(조회 2026-10-14)에 METRON이 없고 단종 공지도 확인하지 못해, 공식 자료로 확인되지 않은 사양은 싣지 않았습니다. 현행 여부는 제조사 확인 후 안내해 드립니다. 현행 MICRON(빔 간격 5 mm부터)은 METRON의 공식 후속으로 표기된 제품은 아니지만 비교 검토 대상입니다.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
&lt;p class="src"&gt;조회 2026-10-14. JTEKT 제품 페이지 · 종합 카탈로그 Vol.20(APS · CS 시리즈, 폐지 형번 페이지), Banner 제품 페이지 · 데이터시트 · 매뉴얼, ReeR 공식 사이트(MICRON 제품 페이지 · 데이터시트 · 측정용 라이트 커튼 목록), Vitrek(MTI Instruments) 제품 페이지 · 브로셔, SIKO 제품 페이지 · 데이터시트 · TÜV SÜD 인증서(IMS365R)의 표기. 승인된 정정안(Q3X 명칭, Microtrak 3 · 4, LE 분해능, Q5X 범위, MINI-ARRAY, IK360 · IMS360 사양)은 반영했고, MICRON 빔 간격은 제조사 현행 MI 300 시리즈 제품 페이지(5 mm) 기준으로 적음. 제조사 자료에 값이 없거나 형번별 대응이 불분명한 칸은 '데이터시트 참조'.&lt;/p&gt;

  function openM(){

&lt;/script&gt;&lt;script data-src="quote-flow.js"&gt;/* v79 — 요청서를 열기 전과 최종 내용 확인 전, 동일한 수량 검사 */
(function () {
  'use strict';
  function validate(container) {
    if (!container) return false;
    var first = null;
    container.querySelectorAll('input[data-k="q"]').forEach(function (input) {
      var n = Number(input.value);
      var ok = input.value.trim() !== '' &amp;&amp; Number.isSafeInteger(n) &amp;&amp; n &gt;= 1;
      input.setCustomValidity(ok ? '' : '수량은 1 이상의 정수로 입력해 주세요.');
      input.setAttribute('aria-invalid', String(!ok));
      if (!ok &amp;&amp; !first) first = input;
    });
    var error = container.querySelector('.v79-error');
    if (!error) {
      error = document.createElement('p');
      error.className = 'v79-error';
      error.setAttribute('role', 'alert');
      (container.querySelector('.qft') || container).appendChild(error);
    }
    error.textContent = first ? '수량은 1 이상의 정수로 입력해 주세요.' : '';
    if (first) {
      first.focus();
      first.reportValidity();
      return false;
    }
    return true;
  }
  window.KQ79 = {validate: validate};
  document.addEventListener('input', function (e) {
    if (e.target.matches('#qm [data-k=q],#bk [data-k=q]')) {
      e.target.setCustomValidity('');
      e.target.removeAttribute('aria-invalid');
      var box = e.target.closest('#qm,#bk');
      var error = box.querySelector('.v79-error');
      if (error) error.textContent = '';
    }
  });
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-act=request]');
    if (!link) return;
    e.preventDefault();
    var modal = document.getElementById('qm');
    if (!modal.querySelector('[data-k=q]') || !validate(modal)) return;
    // 문의서에서 다시 열어 수정해도 이미 입력한 담당자/연락처는 보존한다.
    var form = document.getElementById('inqf');
    if (form) {
      KQ.close();
      document.getElementById('done').classList.remove('show');
      document.getElementById('inqw').hidden = false;
      form.scrollIntoView({behavior: 'smooth', block: 'start'});
    } else {
      location.href = link.getAttribute('href');
    }
  });
})();
