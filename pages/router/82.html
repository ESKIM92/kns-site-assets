&lt;tbody id="tb"&gt;&lt;tr class="r" data-id="r541" id="r541"&gt;&lt;td class="ck"&gt;&lt;input aria-label="IVU2PTB 견적 담기" data-n="터치스크린 일체형 이미저 바코드 리더 (iVu Plus BCR Gen2 · 752 × 480 · Ethernet)" data-q="IVU2PTB" type="checkbox"/&gt;&lt;/td&gt;&lt;td class="im"&gt;&lt;span aria-label="IVU2PTB" class="spr" role="img" style="background-image:url(https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/sprite/barcode.png);background-position:0 33.33333333%;background-size:100% auto;background-repeat:no-repeat;aspect-ratio:1"&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class="nm"&gt;&lt;b&gt;IVU2PTB&lt;/b&gt;&lt;small&gt;터치스크린 일체형 이미저 바코드 리더 (iVu Plus BCR Gen2 · 752 × 480 · Ethernet)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;Banner&lt;/td&gt;&lt;td&gt;1차원 + 2차원&lt;br/&gt;&lt;small&gt;Code128 · Data Matrix · QR 외&lt;/small&gt;&lt;/td&gt;&lt;td&gt;752 × 480 · 60 fps (설정별 변동)&lt;br/&gt;&lt;small&gt;조명색 · 렌즈 4.3 ~ 25 mm 선택&lt;/small&gt;&lt;/td&gt;&lt;td&gt;Ethernet · RS-232&lt;br/&gt;&lt;small&gt;EtherNet/IP · PROFINET · Modbus/TCP · PCCC&lt;/small&gt;&lt;/td&gt;&lt;td&gt;81 × 79 × 52 mm&lt;br/&gt;&lt;small&gt;IP67 (마이크로 비디오 렌즈형)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;&lt;span class="mks"&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="dx" data-for="r541" hidden=""&gt;&lt;td colspan="8"&gt;&lt;div class="dxi"&gt;&lt;div class="dxs"&gt;&lt;div&gt;&lt;span&gt;전원&lt;/span&gt;&lt;b&gt;DC 10 ~ 30 V (최대 1 A, 입출력 부하 제외)&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;사용 온도&lt;/span&gt;&lt;b&gt;0 ~ +45 ℃ (터치 디스플레이 일체형 모델)&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dxf"&gt;&lt;span class="dxl"&gt;주요 특징&lt;/span&gt;&lt;ul&gt;&lt;li&gt;하나의 본체에 센서 · 조명 · 렌즈 · 터치 디스플레이가 들어 있음 — PC 없이 본체 터치스크린으로, 또는 Vision Manager 소프트웨어로 설정 (제조사 표기)&lt;/li&gt;&lt;li&gt;모델 코드: IVU2PTB + 조명색 (X 없음 · R 적 · B 청 · G 녹 · I 적외선 · W 백 · 6 / 9 자외선) + 렌즈 (04 = 4.3 mm · 06 · 08 · 12 · 16 · 25 mm, 또는 XC = C마운트)&lt;/li&gt;&lt;li&gt;1/3인치 CMOS 752 × 480, 노출 시간 0.1 ms ~ 1.049 s, 출력 NPN / PNP 소프트웨어 선택 (150 mA)&lt;/li&gt;&lt;li&gt;읽는 코드: 1D — Code 128 · Code 39 · Code 93 · Codabar · DataBar · Interleaved 2 of 5 · EAN13 · EAN8 · UPC-E · PDF417 등 / 2D — Data Matrix · QR · Micro QR&lt;/li&gt;&lt;li&gt;외형 81 × 79 × 52 mm (W × H × D)는 마이크로 비디오 렌즈 모델 IVU2PTBR08 기준이며, IP67도 마이크로 비디오 렌즈 모델만 해당 (제조사 표기)&lt;/li&gt;&lt;li&gt;USB 2.0 호스트(M8 4핀)는 USB 메모리로 설정 · 로그를 저장하고 불러오는 용도 (선택 케이블 필요), 프레임 속도 60 fps는 검사 설정에 따라 달라짐&lt;/li&gt;&lt;li&gt;리모트 디스플레이 방식은 IVU2PRB 항목 참조&lt;/li&gt;&lt;/ul&gt;&lt;p class="dxsrc" style="color:#A85400"&gt;참고 · 이 계열 중 IVU2PTB-808142 한 형번은 제조사 부품 페이지에 단종(INACTIVE)으로 표기되어 있고 후속 형번 표기는 없습니다. 시리즈 자체는 현행(RELEASED)이며, 조명색 · 렌즈 조합별 형번은 견적 때 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="ac"&gt;&lt;a class="btn sm b1" href="/shop_view/?idx=541"&gt;상세 보기 →&lt;/a&gt;&lt;a class="dsb" href="https://info.bannerengineering.com/cs/groups/public/documents/literature/179047.pdf" rel="noopener" target="_blank" title="iVu Plus BCR Gen2 Series Sensor Instruction Manual · info.bannerengineering.com"&gt;&lt;svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"&gt;&lt;path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"&gt;&lt;/path&gt;&lt;path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"&gt;&lt;/path&gt;&lt;/svg&gt;매뉴얼 PDF&lt;/a&gt;&lt;button class="qadd" data-n="터치스크린 일체형 이미저 바코드 리더 (iVu Plus BCR Gen2 · 752 × 480 · Ethernet)" data-q="IVU2PTB" type="button"&gt;+ 견적 담기&lt;/button&gt;&lt;/div&gt;&lt;p class="dxsrc"&gt;자료 출처 · Banner Engineering 부품 페이지 IVU2PTBR08 (part 90741) (https://www.bannerengineering.com/us/en/products/part.90741.html) · iVu Plus BCR Gen2 매뉴얼 179047 (https://info.bannerengineering.com/cs/groups/public/documents/literature/179047.pdf)&lt;/p&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="r" data-id="r542" id="r542"&gt;&lt;td class="ck"&gt;&lt;input aria-label="IVU2PRB 견적 담기" data-n="원격 터치 디스플레이 연결형 이미저 바코드 리더 (iVu Plus BCR Gen2 · 752 × 480 · Ethernet)" data-q= &lt;p class="lvnote" id="lvnote"&gt;사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.&lt;/p&gt;
&lt;p id="tvnote" style="font-size:12.5px;color:#5E6B78;padding:10px 16px"&gt;행을 누르면 전원 · 사용 온도 · 특징 · 자료 출처가 펼쳐집니다. 사양은 대표값이며 형번(옵션)에 따라 다릅니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다.&lt;/p&gt;

&lt;section class="box blk apc" id="apc"&gt;&lt;div class="aph"&gt;&lt;div&gt;&lt;h2&gt;이 제품이 쓰인 현장&lt;/h2&gt;&lt;p class="apl"&gt;제조사가 공개한 실제 적용 사례 6건 — 어떤 설비에서 무엇을 해결했는지 보고 선정에 참고하세요.&lt;/p&gt;&lt;/div&gt;&lt;a class="apall" href="/15#p=barcode"&gt;적용 사례 6건 전체 보기 ›&lt;/a&gt;&lt;/div&gt;&lt;div class="apg"&gt;&lt;a class="apk" href="/15#banner-label"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/banner-label.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;포장 · 식품 · 음료 · Banner&lt;/span&gt;&lt;b&gt;플라스틱 용기 라벨 검사 — 월 2,000병 폐기를 줄이다&lt;/b&gt;&lt;span class="ac2"&gt;고객사 비공개&lt;/span&gt;&lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#banner-qr"&gt;&lt;span class="ai"&gt;&lt;span&gt;Banner&lt;/span&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;자동차 · 부품 가공 · Banner&lt;/span&gt;&lt;b&gt;변속기 QR 코드 자동 판독&lt;/b&gt;&lt;span class="ac2"&gt;고객사 비공개&lt;/span&gt;&lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#mars-mixed"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/mars-mixed.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;자동차 · 부품 가공 · Mars Tohken&lt;/span&gt;&lt;b&gt;혼류 라인 DPM 코드 안정 판독 — 라인별 설정 저장 · 호출&lt;/b&gt;&lt;span class="ac2"&gt;고객사 비공개&lt;/span&gt;&lt;span class="apb re"&gt;관련 사례&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="apk" href="/15#mars-quality"&gt;&lt;span class="ai"&gt;&lt;img alt="" loading="lazy" src="https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/app/mars-quality.jpg"/&gt;&lt;/span&gt;&lt;span class="at"&gt;&lt;span class="ag"&gt;자동차 · 부품 가공 · Mars Tohken&lt;/span&gt;&lt;b&gt;레이저 마킹 2D 코드 인자 품질을 인라인으로 검증&lt;/b&gt;&lt;span class="ac2"&gt;고객사 비공개&lt;/span&gt;&lt;span class="apb re"&gt;관련 사례&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;p class="apn"&gt;표시: &lt;span class="apb ex"&gt;적용 형번&lt;/span&gt; 사례에 그 형번이 명시됨 · &lt;span class="apb se"&gt;같은 시리즈&lt;/span&gt; 같은 시리즈 · 계열 사용 · &lt;span class="apb re"&gt;관련 사례&lt;/span&gt; 같은 제조사의 관련 제품(당사 선정표 외 형번 포함). 사례 내용은 제조사 공개 자료 기준입니다.&lt;/p&gt;&lt;/section&gt;
&lt;section class="box blk" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#EEF5FB,#DCEBF8)"&gt;
&lt;div style="flex:1 1 420px"&gt;&lt;h2&gt;찾는 사양이 없거나 쓰시던 형번으로 바꾸고 싶으신가요?&lt;/h2&gt;&lt;p class="lead" style="color:#3D4A57"&gt;쓰시던 형번과 명판 사진을 보내 주시면 사양을 맞춰 검토 결과를 회신드립니다. 사양이 완전히 같지 않을 수 있어 비교표와 함께 제안드립니다.&lt;/p&gt;&lt;/div&gt;
&lt;div style="display:flex;gap:8px;flex-wrap:wrap"&gt;&lt;a class="btn b1" href="/substitute"&gt;대체 검토 요청&lt;/a&gt;&lt;a class="btn b2" href="/16"&gt;견적 · 기술 문의&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;div data-pane="guide" hidden=""&gt;&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;바코드 리더 · 코드 스캐너 선정 가이드&lt;/h2&gt;&lt;p class="lead"&gt;아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.&lt;/p&gt;&lt;div class="g4"&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;고정형 / 핸디형&lt;/h3&gt;&lt;p&gt;설비 · 컨베이어에 장착해 자동으로 읽으면 고정형, 작업자가 손으로 읽으면 핸디형입니다. 스탠드에 거치해 자동 트리거로 쓰는 소형 리더도 있으므로(CR1100: 수동 / 자동 트리거, 핸디 / 프레젠테이션형으로 안내) 설치 방식을 함께 정합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;읽을 코드&lt;/h3&gt;&lt;p&gt;1차원 바코드만 읽으면 레이저 방식(TLMS-5500RV · 5600RV)도 후보이고, 2차원 코드가 있으면 이미저 방식을 고릅니다. 기판 · 금속 · 유리에 직접 새긴 DPM 코드는 DPM 대응 모델(MCR-F600, MCR-H700/710, MCR-H720, ABR 7000)에서 고르며, 코드의 최소 셀 크기가 모델의 최소 분해능 이내인지 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;읽는 거리 · 시야 · 속도&lt;/h3&gt;&lt;p&gt;읽는 거리와 시야는 렌즈와 조명에 따라 달라집니다. 렌즈를 고르는 모델(Banner iVu: 4.3 ~ 25 mm 및 C마운트, MCR-F600: C마운트 외장)은 렌즈 선정표로 시야를 계산하고, 근거리 광각형(TLMS-5600RV: 스캔면 50 mm에서 200 mm 바코드)은 설치 공간을 봅니다. 움직이는 대상이면 스캔 속도(레이저 600 ~ 700 스캔/s) 또는 이미저 프레임 속도(최대 60 fps)를 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;4&lt;/span&gt;&lt;h3&gt;통신 · 전원 · 환경&lt;/h3&gt;&lt;p&gt;상위 장치가 RS-232C · USB · Ethernet 중 무엇을 받는지, PLC 직결 또는 CC-Link · EtherNet/IP · PROFINET이 필요한지 확인합니다. 전원(DC 5 V 또는 12 ~ 24 V), 보호 등급(IP4x ~ IP67), 사용 온도(0 ~ 40 ℃ 모델이 많음), 정전기(ESD) 대책 필요 여부도 봅니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="disc" hidden=""&gt;&lt;section class="box" style="padding:18px"&gt;&lt;h2&gt;MTS 제품별 공급·선정 안내&lt;/h2&gt;&lt;p&gt;&lt;a href="/mts#s=%EC%BC%80%EC%9D%B4%EB%B8%94%C2%B7%EC%A0%84%EC%9B%90%C2%B7%EB%A0%8C%EC%A6%88"&gt;&lt;b&gt;케이블·전원·렌즈&lt;/b&gt;&lt;/a&gt; — 공식 사양 자료 대조가 완료되지 않은 항목입니다. 아래 등록 형번을 기준으로 구성·자료를 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=EX-TLMS-3500RV"&gt;&lt;b&gt;EX-TLMS-3500RV&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=THIR-6781"&gt;&lt;b&gt;THIR-6781&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=BHT-M60"&gt;&lt;b&gt;BHT-M60&lt;/b&gt;&lt;/a&gt; — 공식 페이지에 판매 종료 안내가 있습니다. 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=BHT-M80"&gt;&lt;b&gt;BHT-M80&lt;/b&gt;&lt;/a&gt; — 공식 페이지에 판매 종료 안내가 있습니다. 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=Smart-Ex%2003"&gt;&lt;b&gt;Smart-Ex 03&lt;/b&gt;&lt;/a&gt; — Zone2 모델 판매 종료 안내가 있습니다. Zone1 모델과 구분해 선정하세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=CT60"&gt;&lt;b&gt;CT60&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=MID-200"&gt;&lt;b&gt;MID-200&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=Smart-Ex%2002"&gt;&lt;b&gt;Smart-Ex 02&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=MID-200Plus"&gt;&lt;b&gt;MID-200Plus&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=TCD-8600"&gt;&lt;b&gt;TCD-8600&lt;/b&gt;&lt;/a&gt; — 생산 종료 제품입니다. 아래 사양은 기존 제품 확인용이며, 공급·대체 기종을 확인해 주세요.&lt;/p&gt;&lt;p&gt;&lt;a href="/mts#s=CR2702"&gt;&lt;b&gt;CR2702&lt;/b&gt;&lt;/a&gt; — 공식 사양 자료 대조가 완료되지 않은 항목입니다. 아래 등록 형번을 기준으로 구성·자료를 확인해 주세요.&lt;/p&gt;&lt;/section&gt;&lt;section class="box blk" id="disc"&gt;&lt;h2&gt;단종 상품 · 후속 형번&lt;/h2&gt;&lt;p class="lead"&gt;제조사 단종 안내 기준입니다. 단종 문의도 받습니다 — 후속 · 대체 제품으로 안내해 드립니다.&lt;/p&gt;&lt;table class="kt"&gt;&lt;tr class="gh"&gt;&lt;th&gt;단종 형번&lt;/th&gt;&lt;th&gt;제조사&lt;/th&gt;&lt;th&gt;시기&lt;/th&gt;&lt;th&gt;후속 · 대체&lt;/th&gt;&lt;th&gt;근거&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;MCR-F530&lt;/th&gt;&lt;td&gt;Mars Tohken&lt;/td&gt;&lt;td&gt;2028-08-31 보수 종료 (판매는 재고 소진 시 종료)&lt;/td&gt;&lt;td&gt;MCR-F1000 / MCR-F1000-H&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.mars-tohken.co.jp/barcode/products/fixed-scanner/mcr-f530/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;MVF-500 / MVF-500C&lt;/th&gt;&lt;td&gt;Mars Tohken&lt;/td&gt;&lt;td&gt;2028-04-30 보수 종료 (판매는 재고 소진 시 종료)&lt;/td&gt;&lt;td&gt;MCR-F1000 / MCR-F1000-H&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.mars-tohken.co.jp/barcode/products/fixed-scanner/mvf-500/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;TCD-8600 (TCD-8600F · TCD-8600S)&lt;/th&gt;&lt;td&gt;Mars Tohken&lt;/td&gt;&lt;td&gt;2031-03-31 보수 종료 (판매는 재고 소진 시 종료)&lt;/td&gt;&lt;td&gt;제조사 후속 표기 없음 · 대체 검토 (제조사: 후속 기종은 영업 담당 문의)&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.mars-tohken.co.jp/barcode/products/fixed-scanner/tcd-8600/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;THIR-6781 / THIR-6781R (사이트 표기 THIR-6780)&lt;/th&gt;&lt;td&gt;Mars Tohken&lt;/td&gt;&lt;td&gt;2031-03-31 보수 종료 (구형 THIR-6780U · 6780R · 6780U-H는 2027-02-28)&lt;/td&gt;&lt;td&gt;MCR-H200 시리즈&lt;/td&gt;&lt;td style="font-size:12px;word-break:break-all"&gt;&lt;a href="https://www.mars-tohken.co.jp/barcode/products/handy-scanner/thir-6780/" rel="noopener" style="color:#0070C0" target="_blank"&gt;제조사 자료&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/section&gt;&lt;/div&gt;

en.co.jp/barcode/products/handy-scanner/mcr-h700/" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;MCR-H700 / H710 시리즈&lt;/b&gt;&lt;small&gt;Mars Tohken 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.mars-tohken.co.jp/barcode/products/handy-scanner/mcr-h720/" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;MCR-H720 시리즈&lt;/b&gt;&lt;small&gt;Mars Tohken 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.mars-tohken.co.jp/support/autoid/discontinued/" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;생산 종료 제품 목록 (바코드 · RFID)&lt;/b&gt;&lt;small&gt;Mars Tohken 공식 — 제품 페이지 (단종 안내)&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.bannerengineering.com/us/en/products/barcode-readers/imager-barcode-readers/ivu-bcr-series.html" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;iVu BCR 시리즈&lt;/b&gt;&lt;small&gt;Banner Engineering 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.bannerengineering.com/us/en/products/part.90741.html" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;IVU2PTBR08 (part 90741)&lt;/b&gt;&lt;small&gt;Banner Engineering 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.bannerengineering.com/us/en/products/part.90727.html" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;IVU2PRBR04 (part 90727)&lt;/b&gt;&lt;small&gt;Banner Engineering 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.bannerengineering.com/us/en/products/part.29512.html" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;RDM35 (part 29512)&lt;/b&gt;&lt;small&gt;Banner Engineering 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class="dk dk-web" href="https://www.bannerengineering.com/us/en/products/barcode-readers/imager-barcode-readers/abr-barcode-series.html" rel="noopener" target="_blank"&gt;&lt;i&gt;WEB&lt;/i&gt;&lt;span&gt;&lt;b&gt;ABR 시리즈&lt;/b&gt;&lt;small&gt;Banner Engineering 공식 — 제품 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-kns"&gt;&lt;h3&gt;한국케이앤에스(주) 자료실&lt;span&gt;&lt;/span&gt;&lt;em&gt;1&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-kns" href="/59"&gt;&lt;i&gt;KNS&lt;/i&gt;&lt;span&gt;&lt;b&gt;자료실 — 카탈로그&lt;/b&gt;&lt;small&gt;한국케이앤에스(주) 자료실&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class="box blk faq"&gt;&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;1차원 레이저 리더(TLMS-5500RV · 5600RV)로 QR 같은 2차원 코드를 읽을 수 있나요?&lt;/summary&gt;&lt;p&gt;제조사 사양의 적용 코드에 1차원 바코드(JAN/EAN/UPC · ITF · Codabar · Code39 · Code128 등)만 게재되어 있습니다. 2차원 코드를 읽어야 하면 2차원 대응 이미저 방식(예: MCR-F100 · MCR-F600, Banner iVu · ABR)을 고르십시오. 읽을 코드 종류와 최소 셀 크기를 알려 주시면 모델을 검토합니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;IVU2PRB는 RDM35와 꼭 같이 써야 하나요?&lt;/summary&gt;&lt;p&gt;IVU2PRB는 센서 본체에 화면이 없는 리모트형이라 설정과 검사 확인에 원격 터치스크린 디스플레이(RDM35) 또는 PC용 Vision Manager 소프트웨어가 필요합니다. 평상 운전에는 디스플레이가 필수는 아니라고 제조사가 안내합니다. RDM35는 센서에 전용 케이블(0.91 ~ 15.2 m, 별매)로 연결하며, 화면 일체형을 원하면 IVU2PTB를 고릅니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;MCR-F530 · MVF-500 · TCD-8600 · THIR-6780은 아직 구할 수 있나요?&lt;/summary&gt;&lt;p&gt;제조사가 생산 종료로 안내한 형번이며 판매는 재고 소진 시 종료됩니다. 보수 종료는 MCR-F530 2028-08-31, MVF-500 2028-04-30, TCD-8600 2031-03-31, THIR-6781(사이트 표기 THIR-6780) 2031-03-31입니다. 제조사 표기상 후속은 MCR-F530 · MVF-500 → MCR-F1000 / MCR-F1000-H, THIR-6781 → MCR-H200 시리즈이며, TCD-8600은 후속 기종 표기가 없어 영업 담당 문의로 안내됩니다. 쓰시던 형번을 알려 주시면 대응 모델을 검토합니다.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
&lt;p class="src"&gt;조회 2026-10-14. Mars Tohken Solution 공식 제품 페이지(MCR-F100/F110 · MCR-F600 · TLMS-5500RV · TLMS-5600RV · MCR-H200 · MCR-H200-ESD · MCR-H700/H710 · MCR-H720 일문)와 생산 종료 제품 목록, Banner Engineering 공식 부품 페이지 · 제품군 페이지 · 매뉴얼(iVu Plus BCR Gen2 179047, ABR 3000 207637, ABR 7000 207634, RDM35 데이터시트 166096). CR1100은 Code Corporation 사이트에 접속하지 못해 제조사 데이터시트 사본과 AutomationDirect 게재 사양서를 대조해 일치하는 값만 사용했고 보호 등급 · 광각 시야 수직각 · 규격 표기는 자료 간 불일치로 생략. TLMS-5600RV는 제조사 일문 사이트에만 게재(영문 사이트 미게재)되어 있고 소비 전력은 표기값 재확인이 필요해 생략. MCR-F600 · MCR-H200의 최소 분해능은 공개 페이지에 없음. 마크는 홈 타일 확인분만 표기(이 분류는 해당 없음). 미조회: Mars Tohken 카탈로그 PDF(고객 정보 입력 필요), RDM35 데이터시트의 규격 표기란(텍스트로 추출되지 않음). 프로토타입 — 실제 적용 전 형번별 최신 자료와 다시 대조합니다.&lt;/p&gt;

(function(){

  }
  function openM(){
