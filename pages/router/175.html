&lt;div class="kin"&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;무엇&lt;/span&gt;&lt;p&gt;문(가드) 개폐를 코드화 자석 · RFID로 검출하는 ReeR &lt;b&gt;비접촉 안전 센서&lt;/b&gt;와 축 회전 속도를 감시하는 &lt;b&gt;안전 엔코더&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;details class="kdt" open=""&gt;&lt;summary&gt;고르는 순서 · 참고 보기&lt;/summary&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;고르는 순서&lt;/span&gt;&lt;ol class="kst"&gt;&lt;li&gt;&lt;span class="n"&gt;1&lt;/span&gt;&lt;b&gt;감시 대상&lt;/b&gt;&lt;small&gt;도어 위치 (MAGNUS MG · RFID) / 회전 속도 (SAFECODER)&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;2&lt;/span&gt;&lt;b&gt;코딩 방식&lt;/b&gt;&lt;small&gt;코드화 자석 · RFID — 우회 방지 수준은 위험성 평가로&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;3&lt;/span&gt;&lt;b&gt;안전 등급 · 연결 장치&lt;/b&gt;&lt;small&gt;연결하는 모듈 · 컨트롤러와의 조합 기준&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;span class="n"&gt;4&lt;/span&gt;&lt;b&gt;형태 · 접속&lt;/b&gt;&lt;small&gt;하우징 · 검출 거리 / 축 형태 · 공급 전압, M8 · M12 커넥터&lt;/small&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div class="kr"&gt;&lt;span class="kl"&gt;참고&lt;/span&gt;&lt;p class="kn"&gt;안전 등급은 센서 단독이 아니라 연결하는 장치와의 조합으로 정해집니다(EC 적합성 선언 기준).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;tbody id="tb"&gt;&lt;tr class="r" data-id="r374" id="r374"&gt;&lt;td class="ck"&gt;&lt;input aria-label="MAGNUS RFID 견적 담기" data-n="RFID 코드 방식 비접촉 안전 센서 (개별 코딩 3종 · EC 적합성 선언 기준 PL e · SIL 3까지)" data-q="MAGNUS RFID" type="checkbox"/&gt;&lt;/td&gt;&lt;td class="im"&gt;&lt;span aria-label="MAGNUS RFID" class="spr" role="img" style="background-image:url(https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/sprite/safety-sensor.png);background-position:0 0.00000000%;background-size:100% auto;background-repeat:no-repeat;aspect-ratio:1"&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class="nm"&gt;&lt;b&gt;MAGNUS RFID&lt;/b&gt;&lt;small&gt;RFID 코드 방식 비접촉 안전 센서 (개별 코딩 3종 · EC 적합성 선언 기준 PL e · SIL 3까지)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;ReeR&lt;/td&gt;&lt;td&gt;RFID 코드 방식 (자석식 아님)&lt;br/&gt;&lt;small&gt;센서를 3가지 방식으로 개별 코딩 (ReeR 표기)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;데이터시트 참조&lt;/td&gt;&lt;td&gt;PL e · Cat. 4&lt;br/&gt;SIL 3 · SILCL 3 까지&lt;br/&gt;&lt;small&gt;EC 적합성 선언 2016-11-30 (MRFID S · MRFID B)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;데이터시트 참조&lt;/td&gt;&lt;td&gt;데이터시트 참조&lt;/td&gt;&lt;td&gt;&lt;span class="mks"&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="dx" data-for="r374" hidden=""&gt;&lt;td colspan="9"&gt;&lt;div class="dxi"&gt;&lt;div class="dxs"&gt;&lt;div&gt;&lt;span&gt;전원&lt;/span&gt;&lt;b&gt;데이터시트 참조&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;사용 온도&lt;/span&gt;&lt;b&gt;데이터시트 참조&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dxf"&gt;&lt;span class="dxl"&gt;주요 특징&lt;/span&gt;&lt;ul&gt;&lt;li&gt;RFID 코드 방식 안전 센서 — 코드화 자석을 쓰는 MAGNUS MG(자석식)와 방식이 다릅니다. ReeR 표기: RFID 기술로 센서를 3가지 방식으로 개별 코딩할 수 있음&lt;/li&gt;&lt;li&gt;EC 적합성 선언(2016-11-30): MAGNUS MRFID S · MRFID B 센서는 PL e · Cat. 4 · SIL 3 · SILCL 3까지의 안전 기기 — EN 60947-5-3:2013 적용, TÜV SÜD CE 형식 시험(Z10 16 11 24820 068)&lt;/li&gt;&lt;li&gt;ReeR 공개 제품 목록(2026-10-14 조회)에서 이 계열의 형번 페이지 · 데이터시트는 확인되지 않아 사양 칸을 '데이터시트 참조'로 두었습니다 (ReeR 인증 · 선언 목록에는 이 계열의 EC 적합성 선언서가 게재)&lt;/li&gt;&lt;li&gt;ReeR는 R-SAFE RFID(BASIC · PRO · PLUS)를 차세대(Next generation) RFID 스위치로 소개하며 Magnus RFID · Magnus MG 'S' 시리즈와 기계적 호환을 표기 — 전기 사양 · 코딩 방식 · 안전 등급은 별도 확인 필요&lt;/li&gt;&lt;/ul&gt;&lt;p class="dxsrc" style="color:#A85400"&gt;참고 · RFID 방식 센서입니다(자석식 MAGNUS MG와 다름). ReeR 공개 사이트에 이 계열의 제품 페이지 · 데이터시트가 없어 사양을 비워 두었습니다. 단종 공지는 확인되지 않았으니 공급 여부와 R-SAFE RFID 적용 가능 여부는 문의해 주세요.&lt;/p&gt;&lt;/div&gt;&lt;div class="ac"&gt;&lt;a class="btn sm b1" href="/shop_view/?idx=374"&gt;상세 보기 →&lt;/a&gt;&lt;button class="qadd" data-n="RFID 코드 방식 비접촉 안전 센서 (개별 코딩 3종 · EC 적합성 선언 기준 PL e · SIL 3까지)" data-q="MAGNUS RFID" type="button"&gt;+ 견적 담기&lt;/button&gt;&lt;/div&gt;&lt;p class="dxsrc"&gt;자료 출처 · ReeR MAGNUS RFID 제품군 페이지 (https://www.reersafety.com/en/product-category/safety-devices/contactless/magnus-rfid/) · EC 적합성 선언서 DEC_CE_MAGNUS_RFID (2016-11-30) · R-SAFE 페이지 (https://www.reersafety.com/en/r-safe/)&lt;/p&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="r" data-id="r375" id="r375"&gt;&lt;td class="ck"&gt;&lt;input aria-label="MAGNUS MG 견적 담기" data-n="코드화 자석식 비접촉 안전 스위치 (센서 + 자석, 검출 거리 3 ~ 20 mm · IP67)" data-q="MAGNUS MG" type="checkbox"/&gt;&lt;/td&gt;&lt;td class="im"&gt;&lt;span aria-label="MAGNUS MG" class="spr" role="img" style="background-image:url(https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/sprite/safety-sensor.png);background-position:0 50.00000000%;background-size:100% auto;background-repeat:no-repeat;aspect-ratio:1"&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class="nm"&gt;&lt;b&gt;MAGNUS MG&lt;/b&gt;&lt;small&gt;코드화 자석식 비접촉 안전 스위치 (센서 + 자석, 검출 거리 3 ~ 20 mm · IP67)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;ReeR&lt;/td&gt;&lt;td&gt;코드화 자석식 (센서 + 액추에이터 자석)&lt;br/&gt;&lt;small&gt;S 36×26×13 mm (interaxis 22 mm)&lt;br/&gt;B 88×25×14 mm (interaxis 78 mm) · M30 원통&lt;/small&gt;&lt;/td&gt;&lt;td&gt;S 3 ~ 10 mm&lt;br/&gt;B · M30 4 ~ 16 mm&lt;br/&gt;&lt;small&gt;M+ 자석 사용 시 B 7 ~ 18 · M30 7 ~ 20 mm&lt;/small&gt;&lt;/td&gt;&lt;td&gt;연결하는 모듈로 결정&lt;br/&gt;&lt;small&gt;MOSAIC: PL e · SIL 3 · SILCL 3 까지&lt;br/&gt;MAGNUS MGd1 모듈: PL c · SIL 2 · SILCL 1 까지&lt;br/&gt;(EC 적합성 선언 2020-02-13)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;2 NO 접점 · M8 4핀 커넥터&lt;br/&gt;&lt;small&gt;최대 28.8 V DC · 100 mA (TÜV SÜD 인증서)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;IP67&lt;/td&gt;&lt;td&gt;&lt;span class="mks"&gt;&lt;i aria-label="CE 마킹" class="mk mkce" role="img" title="CE 마킹 (EU 적합성 선언)"&gt;&lt;/i&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="dx" data-for="r375" hidden=""&gt;&lt;td colspan="9"&gt;&lt;div class="dxi"&gt;&lt;div class="dxs"&gt;&lt;div&gt;&lt;span&gt;전원&lt;/span&gt;&lt;b&gt;접점 최대 28.8 V DC · 100 mA (TÜV SÜD 인증서) · 전원 사양은 데이터시트 참조&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;사용 온도&lt;/span&gt;&lt;b&gt;−25 ~ +75 ℃&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dxf"&gt;&lt;span class="dxl"&gt;주요 특징&lt;/span&gt;&lt;ul&gt;&lt;li&gt;센서 단품(2 NO 접점)과 액추에이터 자석이 별도 형번 — S 센서 1291000 + 자석 1291001 / B 센서 1291010 + 자석 1291011 (M+ 자석 1291012) / M30 센서 1291020 + 자석 1291021 (M+ 자석 1291022)&lt;/li&gt;&lt;li&gt;열가소성 수지(PBT) 하우징 · 고정: S · B형 M4 나사, M30형 M30 고정 너트 2개&lt;/li&gt;&lt;li&gt;TÜV SÜD 인증서 Z10 024820 0094 (2026-05-07, 유효 2031-02-15): MG x 20 시리즈, 시험 기준 EN ISO 13849-1 (Cat. 4, PL e) · EN 60947-5-3 · EN ISO 14119 Type 4 (낮은 수준 코딩)&lt;/li&gt;&lt;li&gt;안전 등급은 연결하는 모듈에 따라 달라집니다 — MOSAIC 컨트롤러와 PL e까지, MGd1 모듈과 PL c까지 (EC 적합성 선언 2020-02-13). MGd1은 ReeR 현행 제품 목록에서 확인되지 않아 공급 여부를 문의해 주세요&lt;/li&gt;&lt;li data-audit="A84-007"&gt;MGd1 조합의 안전등급은 자료 간 차이가 있어 확정 전입니다. 센서 수·결선·적용 판본에 맞는 인증서/적합성 선언서 원본은 문의해 주세요. 구 카탈로그의 등급을 모든 조합에 적용하지 않습니다.&lt;/li&gt;&lt;li data-audit="A90-002"&gt;MAGNUS 원통형의 구 카탈로그 M20과 현행 페이지 M30 표기가 다릅니다. 실제 형번의 외형 도면으로 설치 치수를 확인해 주세요.&lt;/li&gt;&lt;li data-audit="A90-003"&gt;제공된 제조사 카탈로그에서 MAGNUS 강화 자석 M+는 4 mm 초과 간격을 피할 수 없는 경우에만 사용하도록 안내합니다. 일반 자석의 단순 상위호환이 아니며 설치별 ON/OFF 거리와 최소 간격을 확인해야 합니다.&lt;/li&gt;&lt;/ul&gt;&lt;p class="dxsrc" style="color:#A85400"&gt;참고 · 검출 거리는 센서와 해당 자석을 조합한 값입니다. 하우징(S · B · M30)과 거리에 맞는 센서 + 자석 조합은 문의해 주세요.&lt;/p&gt;&lt;/div&gt;&lt;div class="ac"&gt;&lt;a class="btn sm b1" href="/shop_view/?idx=375"&gt;상세 보기 →&lt;/a&gt;&lt;a class="dsb" href="https://www.reersafety.com/datasheet/en/1291000.pdf" rel="noopener" target="_blank" title="MAGNUS MG S 20 · reersafety.com"&gt;&lt;svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"&gt;&lt;path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"&gt;&lt;/path&gt;&lt;path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"&gt;&lt;/path&gt;&lt;/svg&gt;데이터시트 PDF · MAGNUS MG S 20&lt;/a&gt;&lt;button class="qadd" data-n="코드화 자석식 비접촉 안전 스위치 (센서 + 자석, 검출 거리 3 ~ 20 mm · IP67)" data-q="MAGNUS MG" type="button"&gt;+ 견적 담기&lt;/button&gt;&lt;/div&gt;&lt;p class="dxsrc"&gt;자료 출처 · ReeR 제품 페이지 MAGNUS MG S 20 (https://www.reersafety.com/en/product/magnus-mg-s-20-1291000/) · B 20 (https://www.reersafety.com/en/product/magnus-mg-b-20-1291010/) · M 20 (https://www.reersafety.com/en/product/magnus-mg-m-20-1291020/) · TÜV SÜD 인증서 CERT_MAGNUS_01 · EC 적합성 선언서 DEC_CE_MAGNUS_MG (2020-02-13)&lt;/p&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="r" data-id="r376" id="r376"&gt;&lt;td class="ck"&gt;&lt;input aria-label="SAFECODER 견적 담기" data-n="Sin/Cos 출력 안전 엔코더 (속도 감시용 · 2048 펄스 · SIL 3 · PL e)" data-q="SAFECODER" type="checkbox"/&gt;&lt;/td&gt;&lt;td class="im"&gt;&lt;span aria-label="SAFECODER" class="spr" role="img" style="background-image:url(https://cdn.jsdelivr.net/gh/ESKIM92/kns-site-assets@21a1046ebcc45865370be783f5542f026b1d23c5/img/sprite/safety-sensor.png);background-position:0 100.00000000%;background-size:100% auto;background-repeat:no-repeat;aspect-ratio:1"&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class="nm"&gt;&lt;b&gt;SAFECODER&lt;/b&gt;&lt;small&gt;Sin/Cos 출력 안전 엔코더 (속도 감시용 · 2048 펄스 · SIL 3 · PL e)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;ReeR&lt;/td&gt;&lt;td&gt;인크리멘탈 Sin/Cos 안전 엔코더&lt;br/&gt;&lt;small&gt;SC3 24D2048R · 05D2048R: 중공축 Ø12 (커플링 플랜지)&lt;br/&gt;SC3 24B2048R · 05B2048R: 축 Ø10×20 mm (평면 가공)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;2048 펄스&lt;br/&gt;&lt;small&gt;Sin/Cos 출력&lt;/small&gt;&lt;/td&gt;&lt;td&gt;SIL 3 · SILCL 3&lt;br/&gt;PL e · Cat. 4&lt;br/&gt;&lt;small&gt;MOSAIC + MV1 · MV2 조합 시 (EC 적합성 선언 2021-04-29)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;M12 방사형 커넥터&lt;br/&gt;&lt;small&gt;24 V형(24…) · 5 V형(05…) 선택&lt;/small&gt;&lt;/td&gt;&lt;td&gt;본체 · 플랜지 IP67&lt;br/&gt;&lt;small&gt;축부 IP65 (IP67 선택)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;&lt;span class="mks"&gt;&lt;i aria-label="UL Listed (cULus)" class="mk mkul mkulj" role="img" title="UL Listed (cULus · 미국 · 캐나다)"&gt;&lt;/i&gt;&lt;i aria-label="CE 마킹" class="mk mkce" role="img" title="CE 마킹 (EU 적합성 선언)"&gt;&lt;/i&gt;&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr class="dx" data-for="r376" hidden=""&gt;&lt;td colspan="9"&gt;&lt;div class="dxi"&gt;&lt;div class="dxs"&gt;&lt;div&gt;&lt;span&gt;전원&lt;/span&gt;&lt;b&gt;24 V형: 제품 설명 10 ~ 30 V DC / 사양표 24 ± 20 % (표기 상충 — 데이터시트 참조) · 5 V형: 5 V DC&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;사용 온도&lt;/span&gt;&lt;b&gt;데이터시트 참조&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dxf"&gt;&lt;span class="dxl"&gt;주요 특징&lt;/span&gt;&lt;ul&gt;&lt;li&gt;형번 4종 (모두 2048 펄스 · M12 방사형): SC3 24D2048R(1100102) 10 ~ 30 V DC · 중공축 Ø12 / 05D2048R(1100103) 5 V DC · 중공축 Ø12 / 24B2048R(1100104) 10 ~ 30 V DC · 축 Ø10×20 mm 평면 / 05B2048R(1100105) 5 V DC · 축 Ø10×20 mm 평면&lt;/li&gt;&lt;li&gt;EC 적합성 선언(2021-04-29): MOSAIC 안전 컨트롤러와 MV1 · MV2 확장 모듈과 조합 시 SIL 3 (EN 61800-5-2) · PL e (EN ISO 13849-1), TÜV Rheinland(NB 0035) CE 형식 시험&lt;/li&gt;&lt;li&gt;ReeR 제품 페이지 안전 등급 표기: SIL 3 · SILCL 3 · PL e · Cat. 4 — 조합 장치 조건은 위 선언서 기준&lt;/li&gt;&lt;li data-audit="A90-001"&gt;SAFECODER 5 V형도 제품 설명과 전기표 전압이 상충합니다. 5 V형과 24 V형 모두 개별 정격 확인이 필요하며 표기만 보고 전원을 연결하지 마세요.&lt;/li&gt;&lt;/ul&gt;&lt;p class="dxsrc" style="color:#A85400"&gt;참고 · 공급 전압은 제품 설명(10 ~ 30 V DC · 5 V DC)과 사양표(24 ± 20 %)의 표기가 달라 견적 때 데이터시트로 확인해 드립니다. 동작 온도 · 최대 회전수 · 출력 신호 진폭은 ReeR 공개 페이지에 없습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="ac"&gt;&lt;a class="btn sm b1" href="/shop_view/?idx=376"&gt;상세 보기 →&lt;/a&gt;&lt;a class="dsb" href="https://www.reersafety.com/datasheet/en/1100102.pdf" rel="noopener" target="_blank" title="SAFECODER SC3 24D2048R · reersafety.com"&gt;&lt;svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"&gt;&lt;path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"&gt;&lt;/path&gt;&lt;path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"&gt;&lt;/path&gt;&lt;/svg&gt;데이터시트 PDF · SAFECODER SC3 24D2048R&lt;/a&gt;&lt;button class="qadd" data-n="Sin/Cos 출력 안전 엔코더 (속도 감시용 · 2048 펄스 · SIL 3 · PL e)" data-q="SAFECODER" type="button"&gt;+ 견적 담기&lt;/button&gt;&lt;/div&gt;&lt;p class="dxsrc"&gt;자료 출처 · ReeR 제품 페이지 SAFECODER SC3 24D2048R (https://www.reersafety.com/en/product/safecoder-sc3-24d2048r-1100102/) 및 관련 3종 · 제품군 설명 'Incremental Sine/Cosine Safety Encoders for Speed Monitoring' · EC 적합성 선언서 DEC_CE_SAFECODER (2021-04-29)&lt;/p&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;

&lt;p class="lvnote" id="lvnote"&gt;사양은 대표값이며 형번(옵션)에 따라 다릅니다. 칸에는 핵심 값만 보이고, 세부 값 · 전원 · 사용 온도 · 자료 출처는 “전체 사양”을 펼치면 보입니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다. 데이터시트 링크는 이 페이지 자료 칸의 제조사 문서 중 형번이 맞는 것만 연결했습니다.&lt;/p&gt;
&lt;p id="tvnote" style="font-size:12.5px;color:#5E6B78;padding:10px 16px"&gt;행을 누르면 전원 · 사용 온도 · 특징 · 자료 출처가 펼쳐집니다. 사양은 대표값이며 형번(옵션)에 따라 다릅니다. "데이터시트 참조"는 제조사 공개 페이지에 값이 없어 견적 때 확인해 드리는 항목입니다.&lt;/p&gt;
&lt;p hidden="" id="none" style="padding:24px;text-align:center;color:#5E6B78"&gt;조건에 맞는 상품이 없습니다. 조건을 줄이거나 &lt;a href="/substitute" style="color:#0070C0"&gt;쓰시던 형번으로 문의&lt;/a&gt;해 주세요.&lt;/p&gt;

1 · MV2 조합 시 (EC 적합성 선언 2021-04-29)&lt;/li&gt;&lt;li&gt;형번 4종 (모두 2048 펄스 · M12 방사형): SC3 24D2048R(1100102) 10 ~ 30 V DC · 중공축 Ø12 / 05D2048R(1100103) 5 V DC · 중공축 Ø12 / 24B2048R(1100104) 10 ~ 30 V DC · 축 Ø10×20 mm 평면 / 05B2048R(1100105) 5 V DC · 축 Ø10×20 mm 평면&lt;/li&gt;&lt;/ul&gt;&lt;div class="mks" style="display:flex;gap:6px;margin-top:8px"&gt;&lt;i aria-label="UL Listed (cULus)" class="mk mkul mkulj" role="img" title="UL Listed (cULus · 미국 · 캐나다)"&gt;&lt;/i&gt;&lt;i aria-label="CE 마킹" class="mk mkce" role="img" title="CE 마킹 (EU 적합성 선언)"&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="rt"&gt;&lt;a class="btn sm b1" href="/shop_view/?idx=376"&gt;상세 보기&lt;/a&gt;&lt;a class="dsb" href="https://www.reersafety.com/datasheet/en/1100102.pdf" rel="noopener" target="_blank" title="SAFECODER SC3 24D2048R · reersafety.com"&gt;&lt;svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"&gt;&lt;path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"&gt;&lt;/path&gt;&lt;path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"&gt;&lt;/path&gt;&lt;/svg&gt;데이터시트 PDF · SAFECODER SC3 24D2048R&lt;/a&gt;&lt;button class="qadd" data-n="Sin/Cos 출력 안전 엔코더 (속도 감시용 · 2048 펄스 · SIL 3 · PL e)" data-q="SAFECODER" style="justify-content:center" type="button"&gt;+ 견적 담기&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;&lt;/section&gt;
&lt;section class="box blk" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#EEF5FB,#DCEBF8)"&gt;
&lt;div style="flex:1 1 420px"&gt;&lt;h2&gt;찾는 사양이 없거나 쓰시던 형번으로 바꾸고 싶으신가요?&lt;/h2&gt;&lt;p class="lead" style="color:#3D4A57"&gt;쓰시던 형번과 명판 사진을 보내 주시면 사양을 맞춰 검토 결과를 회신드립니다. 사양이 완전히 같지 않을 수 있어 비교표와 함께 제안드립니다.&lt;/p&gt;&lt;/div&gt;
&lt;div style="display:flex;gap:8px;flex-wrap:wrap"&gt;&lt;a class="btn b1" href="/substitute"&gt;대체 검토 요청&lt;/a&gt;&lt;a class="btn b2" href="/16"&gt;견적 · 기술 문의&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;div data-pane="guide" hidden=""&gt;&lt;section class="box blk" id="guide"&gt;&lt;h2&gt;비접촉 안전 센서 · 안전 엔코더 선정 가이드&lt;/h2&gt;&lt;p class="lead"&gt;아래 순서로 확인하면 형번을 빠르게 정할 수 있습니다.&lt;/p&gt;&lt;div class="g4"&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;1&lt;/span&gt;&lt;h3&gt;감시 대상&lt;/h3&gt;&lt;p&gt;문(가드)의 개폐를 확인하려면 비접촉 도어 센서(MAGNUS MG 자석식 · MAGNUS RFID)를, 축의 회전 속도를 감시하려면 안전 엔코더(SAFECODER)를 고릅니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;2&lt;/span&gt;&lt;h3&gt;코딩 방식&lt;/h3&gt;&lt;p&gt;MAGNUS MG의 TÜV SÜD 시험 기준은 EN ISO 14119 Type 4 · 낮은 수준 코딩(Low level coded)입니다. RFID 방식은 센서를 3가지 방식으로 개별 코딩할 수 있다고 ReeR가 표기하며, 우회 방지 수준은 설비 위험성 평가로 정한 뒤 코딩 방식을 데이터시트로 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;3&lt;/span&gt;&lt;h3&gt;안전 등급과 연결 장치&lt;/h3&gt;&lt;p&gt;안전 등급은 센서 단독이 아니라 연결하는 장치와의 조합으로 정해집니다. MAGNUS MG는 MOSAIC와 PL e · SIL 3까지, MGd1 모듈과 PL c · SIL 2까지, SAFECODER는 MOSAIC + MV1 · MV2 확장 모듈과 SIL 3 · PL e까지입니다(EC 적합성 선언 기준).&lt;/p&gt;&lt;/div&gt;&lt;div class="stp"&gt;&lt;span class="no"&gt;4&lt;/span&gt;&lt;h3&gt;형태와 접속&lt;/h3&gt;&lt;p&gt;MG는 하우징(S 36×26×13 · B 88×25×14 · 원통 M30)과 검출 거리(S 3 ~ 10 mm, B · M30 4 ~ 16 mm, M+ 자석 사용 시 B 18 mm · M30 20 mm까지)로, SAFECODER는 축 형태(중공축 Ø12 / 축 Ø10×20 mm)와 공급 전압(24 V형 / 5 V형)으로 고릅니다. 접속은 MG가 M8 4핀, SAFECODER가 M12 방사형 커넥터입니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div data-pane="docs" hidden=""&gt;&lt;section class="box blk" id="docs"&gt;&lt;h2&gt;데이터시트 · 자료&lt;/h2&gt;&lt;p class="lead"&gt;최신 자료는 제조사 공식 페이지에서 받으실 수 있습니다. 한글 자료는 자료실에 모아 둡니다.&lt;/p&gt;

R-SAFE RFID (차세대 RFID 스위치)&lt;/b&gt;&lt;small&gt;ReeR 공식 — 제품군 페이지&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class="dg dg-kns"&gt;&lt;h3&gt;한국케이앤에스(주) 자료실&lt;span&gt;&lt;/span&gt;&lt;em&gt;1&lt;/em&gt;&lt;/h3&gt;&lt;div class="dl"&gt;&lt;a class="dk dk-kns" href="/59"&gt;&lt;i&gt;KNS&lt;/i&gt;&lt;span&gt;&lt;b&gt;자료실 — 카탈로그&lt;/b&gt;&lt;small&gt;한국케이앤에스(주) 자료실&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class="box blk faq"&gt;&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;MAGNUS MG와 MAGNUS RFID는 무엇이 다른가요?&lt;/summary&gt;&lt;p&gt;MAGNUS MG는 센서와 코드화 자석(액추에이터)으로 이루어진 자석식(2 NO 접점, 검출 거리 3 ~ 20 mm)이고, MAGNUS RFID는 RFID로 코딩하는 방식입니다. 안전 모듈과의 조합 · 코딩 방식은 형번마다 다르므로 쓰시던 형번을 알려 주시면 사양을 비교해 회신드립니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;MAGNUS RFID는 지금도 구할 수 있나요?&lt;/summary&gt;&lt;p&gt;ReeR 공개 제품 목록(2026-10-14 조회)에는 MAGNUS RFID 형번 페이지가 없고 RFID 안전 센서는 R-SAFE RFID(BASIC · PRO · PLUS)로 게재되어 있습니다. ReeR는 R-SAFE를 차세대(Next generation) RFID 스위치로 소개하며 Magnus RFID · Magnus MG 'S' 시리즈와 기계적 호환을 표기합니다. 단종 공지는 확인되지 않았으므로 공급 여부와 R-SAFE 적용 가능 여부는 문의해 주세요. 전기 사양 · 코딩 방식은 별도 비교가 필요합니다.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;SAFECODER는 어떤 안전 모듈과 함께 쓰나요?&lt;/summary&gt;&lt;p&gt;ReeR EC 적합성 선언서(2021-04-29)는 MOSAIC 안전 컨트롤러와 MV1 · MV2 확장 모듈과의 조합을 기재합니다. MV1 · MV2는 ReeR 제품 페이지에서 속도 감시용 확장 모듈(Safety Speed Monitoring Expansion Unit)로 소개되며 엔코더 입력 방식별(TTL · HTL · Sin/Cos) 형번이 있고, Sin/Cos 입력형은 MV1S · MV2S로 게재되어 있습니다. 사용하실 컨트롤러를 알려 주시면 조합 형번을 확인해 드립니다.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
&lt;p class="src"&gt;조회 2026-10-14. ReeR 공식(reersafety.com): MAGNUS MG S 20 · B 20 · M 20 및 SAFECODER SC3 제품 페이지 · 데이터시트(제품 페이지 출력본), MAGNUS MG TÜV SÜD 인증서(Z10 024820 0094), EC 적합성 선언서 3종(MAGNUS MG 2020-02-13 · MAGNUS RFID 2016-11-30 · SAFECODER 2021-04-29), MAGNUS RFID 제품군 · R-SAFE 페이지, 인증 · 선언 목록. MAGNUS RFID는 개별 제품 페이지가 없어 사양 칸을 비웠고, 공식 단종 표기가 없어 선정표에 남기고 공급 여부 문의로 안내했습니다. 매뉴얼 · 카탈로그 · CAD는 등록 사용자 전용이라 미열람. 인증서 · 선언서 PDF는 ReeR 공식 링크이며 접속 환경에 따라 등록 사용자 페이지로 이동할 수 있어 게시 전 링크를 다시 확인합니다. 마크는 공식 출처 2곳 확인분(CE)만 표기.&lt;/p&gt;
